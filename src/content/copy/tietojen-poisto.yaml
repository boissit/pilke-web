# House style, and what this format is for, is the header of `site.yaml`.
#
# WARNING: **Every claim on this page is checked against the backend's own
# deletion code** by way of `docs/legal/privacy-policy.md` §11, and the two lists
# are that section's two lists. Deletion is a tombstone rather than a row delete,
# so the *what stays* list is the load-bearing half of the page and must not be
# softened.
#
# The kept list has one entry per row of §11.4’s table, in that order, and it is
# meant to stay that way. `legal.deletion.kept.nine` is the case that rule would
# otherwise miss: error and performance records live outside the database, so the
# deletion code never sees them and they age out on a clock of their own.

# ──────────────────────────────────────────────────────────────────────────
# The page itself
# ──────────────────────────────────────────────────────────────────────────

'legal.deletion.title':
  fi: 'Näin poistat tietosi'
  en: 'How to delete your data'

'legal.deletion.lead':
  fi: 'Poistat tilisi itse sovelluksesta. Tällä sivulla kerromme, mikä poistuu heti ja mikä jää talteen.'
  en: 'You delete your account yourself, in the app. This page explains what goes straight away and what stays.'

# ──────────────────────────────────────────────────────────────────────────
# How to delete
# ──────────────────────────────────────────────────────────────────────────

'legal.deletion.app.title':
  fi: 'Poista tili sovelluksessa'
  en: 'Delete your account in the app'

'legal.deletion.app.body':
  fi: 'Avaa Pilke, mene Asetuksiin ja valitse Poista tili. Vahvista puhelinnumerollasi. Tili poistuu heti, eikä sitä saa takaisin.'
  en: 'Open Pilke, go to Settings and choose Delete account. Confirm with your phone number. Your account is deleted straight away and can’t be brought back.'

'legal.deletion.gone.title':
  fi: 'Jos et enää pääse sovellukseen'
  en: 'If you can’t get into the app any more'

'legal.deletion.gone.body':
  fi: 'Kirjoita meille osoitteeseen {email}, niin poistamme tilin puolestasi. Kerro se puhelinnumero, jolla olet kirjautunut, jotta löydämme oikean tilin.'
  en: 'Email us at {email} and we’ll delete the account for you. Tell us the phone number you signed in with, so we can find the right account.'

# ──────────────────────────────────────────────────────────────────────────
# What goes straight away
# ──────────────────────────────────────────────────────────────────────────

'legal.deletion.removed.title':
  fi: 'Mikä poistuu heti'
  en: 'What goes straight away'

'legal.deletion.removed.one':
  fi: 'Puhelinnumero ja sähköpostiosoite.'
  en: 'Your phone number and email address.'

'legal.deletion.removed.two':
  fi: 'Nimimerkki, ikä, sukupuoli ja valokuva. Kuva poistuu myös tallennustilasta.'
  en: 'Your preferred name, age, gender and photo. The photo is deleted from storage too.'

'legal.deletion.removed.three':
  fi: 'Luotettavan henkilön numero.'
  en: 'Your safety contact’s number.'

'legal.deletion.removed.four':
  fi: 'Treffitoiveet ja alue, jonne voisit lähteä treffeille.'
  en: 'Your preferences, and the areas you could go on dates in.'

'legal.deletion.removed.five':
  fi: 'Kalenteriin merkityt ajat ja vastaukset kysymyssarjoihin.'
  en: 'The free times in your calendar, and your answers to the questions.'

'legal.deletion.removed.six':
  fi: 'Kirjautumiset kaikilta laitteilta samalla hetkellä, ja ilmoitusten vastaanotto.'
  en: 'You’re signed out on every device at once, and notifications stop.'

'legal.deletion.removed.seven':
  fi: 'Jaetut sijainnit.'
  en: 'Any location you shared.'

# ──────────────────────────────────────────────────────────────────────────
# What stays
# ──────────────────────────────────────────────────────────────────────────

'legal.deletion.kept.title':
  fi: 'Mikä jää talteen'
  en: 'What stays'

'legal.deletion.kept.lead':
  fi: 'Osa tiedoista on yhtä lailla toisen osapuolen tietoja, ja osa on turvallisuuspäätöksiä, joita lähteminen ei saa kumota. Nämä jäävät, mutta nimesi ei ole niissä enää kiinni.'
  en: 'Some of it belongs to the other person as much as to you, and some of it is a safety decision that leaving mustn’t undo. This stays, but your name is no longer attached to it.'

'legal.deletion.kept.one':
  fi: 'Sovitut ja menneet treffit sekä niistä annetut palautteet. Toinen osapuoli näkee sinun tilallasi ”Joku”.'
  en: 'Upcoming and past dates, and the feedback given about them. The other person sees “Someone” where your name was.'

'legal.deletion.kept.two':
  fi: 'Turvallisuus- ja käytösilmoitukset ja niiden vapaa teksti, sekä sinun kirjoittamat että sinusta kirjoitetut.'
  en: 'Safety and conduct reports and any text written in them, both by you and about you.'

'legal.deletion.kept.three':
  fi: 'Merkintä siitä, että olet painanut turvapainiketta.'
  en: 'A record that you pressed the Safety button.'

'legal.deletion.kept.four':
  fi: 'Merkintä siitä, että teitä ei turvallisuusilmoituksen jälkeen enää ehdoteta toisillenne. Lähteminen ei muuta sitä.'
  en: 'A record that, after a safety report, the two of you are never suggested to each other again. Leaving doesn’t change that.'

'legal.deletion.kept.five':
  fi: 'Ilmoitukset saapumatta jättämisestä, molempiin suuntiin.'
  en: 'No-show reports, both ways.'

'legal.deletion.kept.six':
  fi: 'Kipinähistoria, jotta saldot täsmäävät.'
  en: 'Your spark history, so that balances still add up.'

'legal.deletion.kept.seven':
  fi: 'Käynnissä oleva jäähy, jos sinulla on sellainen. Lähteminen ei lyhennä sitä.'
  en: 'A pause you’re on, if you have one. Leaving doesn’t shorten it.'

'legal.deletion.kept.eight':
  fi: 'Ketkä ehdokkaat sinulle on tarjottu, ja keiden ehdokkaissa olet ollut.'
  en: 'Who you were shown as matches, and who you were shown to.'

'legal.deletion.kept.nine':
  fi: 'Virhe- ja suorituskykytiedot, joissa on tilisi numero. Ne eivät poistu tilin mukana, vaan häviävät itsestään 30 päivän kuluessa.'
  en: 'Error and performance logs that carry your account number. They aren’t deleted with the account, but clear on their own within 30 days.'

# ──────────────────────────────────────────────────────────────────────────
# Dates already agreed, and coming back later
# ──────────────────────────────────────────────────────────────────────────

'legal.deletion.others.title':
  fi: 'Mitä tapahtuu sovituille treffeille'
  en: 'What happens to your upcoming dates'

'legal.deletion.others.body':
  fi: 'Lähettämäsi kutsut perutaan ja saamasi kutsut hylätään, ja kutsujan kipinät palautetaan. Tulevat treffit peruutetaan, ja jos toinen osapuoli oli lähettänyt kutsun, hän saa kipinänsä takaisin. Sinulle ei tule tästä seurauksia, emmekä kerro kenellekään erikseen, että lähdit.'
  en: 'Invites you sent are withdrawn and invites you received are declined, and the sender gets their sparks back. Upcoming dates are cancelled, and if the other person sent the invite, they get their sparks back. None of this counts against you, and we don’t tell anyone separately that you’ve left.'

'legal.deletion.again.title':
  fi: 'Jos palaat myöhemmin'
  en: 'If you come back later'

'legal.deletion.again.body':
  fi: 'Voit rekisteröityä samalla puhelinnumerolla uudelleen. Saat tyhjän tilin, eikä mikään yhdistä sitä vanhaan.'
  en: 'You can sign up again with the same phone number. You’ll get an empty account, with nothing linking it to the old one.'

'legal.deletion.more':
  fi: 'Lue tarkemmin tietosuojaselosteesta'
  en: 'Read more in the privacy policy'
