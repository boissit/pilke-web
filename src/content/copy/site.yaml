# Every string on this site, in both languages, grouped by the page that shows it.
#
# These files are the site's copy. `src/i18n/ui.ts` reads all of them when the site
# is built, and every page draws its strings from here: one page per file, the two
# languages of a sentence on adjacent lines, so copy is read and proofread as copy in
# a file a non-developer can open. The guide and the legal documents are Markdown, in
# `src/content/manual/` and `src/content/legal/`, and are the one other source.
#
# The `key` of each entry is the dotted key a page asks for, `t('hero.title')`, kept
# flat and unnested: one indentation level for somebody editing prose, and a key that
# greps to every place it is drawn.
#
# WARNING: **Both languages, every key.** YAML has no type for that, so `ui.ts`
# checks it instead: an entry with a `fi:` and no `en:`, an empty string, a key in two
# files, or a page asking for a key no file holds fails the build rather than
# shipping a blank.
#
# `docs/copy-desk.md` is how the owner's rewrites reach these files.
#
# ## House style
#
# Finnish is the product's language and the one written first; English is a full
# translation rather than a fallback set.
#
# Product vocabulary is the app's own spelling: the tokens are kipinät, one kipinä,
# in English sparks, and five of them send a treffikutsu. They are never called a
# currency: Pilke pyörii kipinöillä, runs on sparks. A zero balance is
# never "ei kipinää", which means no chemistry, and "kipinöitä lentää" belongs to the
# moment two people say yes. The constants keep their old names, `{{petals.*}}`,
# because the backend does, except `{{sparks.per_date}}`.
#
# The front page is the owner's pitch, and it answers why anybody should care in
# three parts: what Pilke does instead of what the other apps make you do, how it
# goes in practice, and who would be better off elsewhere. Sparks are left to
# `nain-se-toimii`, because a price list on a front page reads as a game to be
# played rather than as an app for meeting people.
#
# The owner's rules for new copy: short, warm, direct and in the second person. A
# sentence opens with what something is, never with what it is not, and carries no
# emphatic add-on ("aina", "ei koskaan enempää") and no reassurance nobody asked
# for. The terms are fixed: löydä ehdokkaat, persoonallisuuskysely, kipinät, jäähy,
# ylläpidetty kalenteri.
#
# Sentences here are short on purpose. A clause that can be its own sentence is one,
# and a paragraph says its point in its first six words.

# ──────────────────────────────────────────────────────────────────────────
# The document itself
#
# The title and description of every page on the site. One pair, not one per
# page: `Base.astro` sets them for all of them, and a per-page description is
# a promise to keep six of them current.
# ──────────────────────────────────────────────────────────────────────────

'meta.title':
  fi: 'Pilke'
  en: 'Pilke'

'meta.description':
  fi: 'Pilke on suomalainen treffisovellus ilman swaippailua ja chättäilyä. Saat kutsun, jossa on jo aika ja paikka, ja menet treffeille.'
  en: 'Pilke is a Finnish dating app with no swiping and no chatting. An invitation arrives with the time and place already in it, and you go on the date.'

# ──────────────────────────────────────────────────────────────────────────
# The bar at the top, and the link that skips it
#
# Three subpages, the guide and a language, in `SiteHeader.astro`, which folds them
# into a menu on a phone; the footer lists the same four. `nav.back` is the button
# every subpage closes with rather than anything in the bar.
# ──────────────────────────────────────────────────────────────────────────

'nav.how':
  fi: 'Näin se toimii'
  en: 'How it works'

'nav.safety':
  fi: 'Turvallisuus'
  en: 'Safety'

'nav.questions':
  fi: 'Kysyttyä'
  en: 'Questions'

'nav.manual':
  fi: 'Ohjeet'
  en: 'Guide'

# The language switch, in the header and the footer, names each language in itself,
# on every page: the English page's link to Finnish reads `Suomi`. So this is the one
# key whose two values are drawn side by side, whichever language the page is in.
'language.name':
  fi: 'Suomi'
  en: 'English'

'nav.skip':
  fi: 'Siirry sisältöön'
  en: 'Skip to content'

'nav.back':
  fi: 'Takaisin etusivulle'
  en: 'Back to the front page'

# The accessible name of the wordmark, in the header and the footer. It is the only
# string here that only a screen-reader user hears.
'nav.home':
  fi: 'Pilke, etusivu'
  en: 'Pilke, home'

'nav.main':
  fi: 'Päävalikko'
  en: 'Main menu'

'nav.menu':
  fi: 'Valikko'
  en: 'Menu'

# ──────────────────────────────────────────────────────────────────────────
# The foot of every page
#
# The wordmark, the two lists of links and the language switch, in
# `SiteFooter.astro`. The legal list's label is `legal.nav`, and the documents name
# themselves from their own frontmatter.
# ──────────────────────────────────────────────────────────────────────────

'footer.rights':
