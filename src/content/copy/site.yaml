  en: 'Pilke'

'footer.pages':
  fi: 'Sivut'
  en: 'Pages'

# ──────────────────────────────────────────────────────────────────────────
# The 404
#
# The page GitHub Pages serves for any address it has no file for. One file for both
# languages, so it carries a line of English under the Finnish.
# ──────────────────────────────────────────────────────────────────────────

'notfound.title':
  fi: 'Hups, tämä sivu jäi saapumatta'
  en: 'Oops, this page didn’t turn up'

'notfound.lead':
  fi: 'Linkki on ehkä vanhentunut. Etusivulta pääset jatkamaan.'
  en: 'The link may be out of date. Carry on from the front page.'

'notfound.home':
  fi: 'Etusivulle'
  en: 'To the front page'
