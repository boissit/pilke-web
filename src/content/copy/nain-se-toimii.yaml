# House style, and what this format is for, is the header of `site.yaml`.
#
# WARNING: **The site does not read this file yet.** `src/i18n/ui.ts` is still what
# every page renders from.
#
# WARNING: **Every number on this page is a backend constant.** Five kipinää for an
# invitation, fifteen held at a time, one hour of shared calendar, at least two times
# offered, a day to answer. The size of a set is deliberately not one of them: what
# the copy emphasises is that the reader picks who the invitation goes to, not how
# many faces they are picking from. They are cited in `README.md`, and a marketing
# page stating a price the product does not charge is worse than a page that stays
# vague.

# ──────────────────────────────────────────────────────────────────────────
# The page itself
# ──────────────────────────────────────────────────────────────────────────

# The detail page. Every number here is the backend's own constant, and the
# README records which.
'detail.title':
  fi: 'Näin Pilke toimii'
  en: 'How Pilke works'

'detail.lead':
  fi: 'Mistä ehdokkaat tulevat, miten kipinät kertyvät ja mitä tapahtuu, kun suunnitelmat muuttuvat. Tässä koko kierto tarkemmin.'
  en: 'Where candidates come from, how sparks build up, and what happens when plans change: the whole loop, in detail.'

# ──────────────────────────────────────────────────────────────────────────
# Before the first invitation
# ──────────────────────────────────────────────────────────────────────────

'detail.start.title':
  fi: 'Ennen ensimmäistä kutsua'
  en: 'Before your first invitation'

'detail.start.body':
  fi: 'Rekisteröinti alkaa puhelinnumerosta ja tekstiviestillä tulevasta koodista. Sen jälkeen annat kutsumanimen, syntymäpäivän ja kuvan.'
  en: 'Signing up starts with a phone number and a code by text. After that you give a name, a birthday and a photo.'

'detail.story.title':
  fi: 'Persoonallisuuskysely'
  en: 'The personality quiz'

'detail.story.body':
  fi: '{{profile.story_questions}} pientä tilannetta, joissa valitset, mitä tekisit. Vastauksesi vaikuttavat siihen, missä järjestyksessä ehdokkaasi näytetään. Kysely etenee kysymys kerrallaan, ja voit jatkaa siitä, mihin jäit. Kysymyssarjoihin voit vastata myöhemmin omaan tahtiisi.'
  en: '{{profile.story_questions}} little situations where you choose what you would do. Your answers shape the order your candidates are shown in. It goes one question at a time, and you can pick up where you left off. The question sets are there to answer later, at your own pace.'

'detail.prefs.title':
  fi: 'Toiveet ja kalenteri'
  en: 'Preferences and calendar'

'detail.prefs.body':
  fi: 'Kerrot, kenen kanssa haluat tavata, minkä ikäisiä ehdokkaita otat vastaan ja millaisia treffejä etsit. Kartalta valitset alueet, joilla voisit käydä treffeillä. Lopuksi merkitset kalenteriin ajat, jolloin sinulle sopii. Alkuun riittää yksi aika, joka on vähintään {{calendar.min_slot_hours}} tunnin mittainen.'
  en: 'You say who you want to meet, what ages you will consider and what kind of date you are looking for. On a map you choose the areas where you could go on a date. Then you mark the times that suit you. A single slot of {{calendar.min_slot_hours}} hour or more is enough to start.'

# ──────────────────────────────────────────────────────────────────────────
# Where candidates come from, and the invitation
# ──────────────────────────────────────────────────────────────────────────

'detail.draw.title':
  fi: 'Mistä ehdokkaat tulevat'
  en: 'Where candidates come from'

'detail.draw.body':
  fi: 'Kun löydät ehdokkaat, jokainen heistä täyttää kolme ehtoa: toiveenne käyvät yksiin, kalentereissanne on vähintään tunti yhteistä aikaa, ja löytyy paikka, johon pääsette molemmat. Sinä valitset, kenelle kutsu lähtee.'
  en: 'When you find candidates, every one of them meets three conditions: your wishes match, your calendars share at least an hour, and there is a place you can both get to. You choose who the invitation goes to.'

'detail.invite.title':
  fi: 'Kutsu ja vastaus'
  en: 'The invitation and the answer'

'detail.invite.body':
  fi: 'Tarjoat kortin yhteisistä ajoista ja paikoista ne, jotka sopivat sinulle. Jotta toinen voi valita, kutsussa on vähintään {{invitation.choice_threshold}} aikaa tai {{invitation.choice_threshold}} paikkaa. Hän valitsee yhden kumpaakin, ja treffit on sovittu. Kutsuun on vastattava {{invitation.answer_hours}} tunnissa.'
  en: 'You offer the shared times and places on the card that suit you. So that the other person has a choice, an invitation holds at least {{invitation.choice_threshold}} times or {{invitation.choice_threshold}} places. They pick one of each, and the date is set. An invitation has to be answered within {{invitation.answer_hours}} hours.'

# ──────────────────────────────────────────────────────────────────────────
# Kipinät
#
# `economy.amount.*` are the amounts in the earning table, and `economy.lead`
# and `economy.spark.alt` belong to the lit sparkle drawn beside it.
# ──────────────────────────────────────────────────────────────────────────

'detail.economy.title':
  fi: 'Kipinät'
  en: 'Sparks'

'detail.economy.body':
  fi: 'Pilke pyörii kipinöiden ympärillä. Niitä kertyy ylläpidetystä kalenterista ja käydyistä treffeistä, ja niillä lähetät treffikutsuja.'
  en: 'Pilke runs on sparks. They build up from a calendar kept up to date and from the dates you go on, and they are what you send invitations with.'

'detail.economy.earn':
  fi: 'Näin kipinöitä kertyy'
  en: 'How sparks add up'

'detail.earn.signup':
  fi: 'Tervetuliaiskipinät'
  en: 'Welcome sparks'

'detail.earn.signup.note':
  fi: 'Kerran, kun vahvistat puhelinnumerosi. Ne riittävät ensimmäiseen kutsuun.'
  en: 'Once, when you confirm your phone number. Enough for your first invitation.'

'detail.earn.calendar':
  fi: '{{calendar.petal_week_hours}} tuntia kalenterissa viikon ajan'
  en: '{{calendar.petal_week_hours}} hours in your calendar, kept for a week'

'detail.earn.calendar.note':
  fi: 'Mukaan lasketaan seuraavan {{calendar.earning_horizon_days}} päivän ajat, kerrallaan enintään {{calendar.counted_hours_cap}} tuntia. Viikossa kipinöitä kertyy siis enintään {{calendar.max_petals_per_week}}.'
  en: 'Times in the next {{calendar.earning_horizon_days}} days count, up to {{calendar.counted_hours_cap}} hours at once, so a week brings at most {{calendar.max_petals_per_week}} sparks.'

'detail.earn.date':
  fi: 'Käydyt treffit'
  en: 'A date you went on'

'detail.earn.date.note':
  fi: 'Kipinät tulevat, kun olet kertonut, miten meni. Kumpikin saa omansa.'
  en: 'The sparks arrive once you have said how it went. Each of you gets your own.'

'detail.economy.spend':
  fi: 'Näin kipinät kuluvat'
  en: 'How sparks are spent'

'detail.economy.spend.body':
  fi: 'Treffikutsuun kuluu {{petals.set_cost}} kipinää. Ne kuluvat heti, kun aloitat kutsun, eli jo ennen kuin valitset, kenet kutsut. Jos sopivia ehdokkaita ei löydy, kipinäsi pysyvät tallessa. Kipinöitä mahtuu kerrallaan {{petals.cap}}, eli {{petals.cap_roses}} kutsun verran, ja sen jälkeen uudet odottavat, kunnes lähetät kutsun. Palautukset tulevat perille, vaikka kipinöitä olisi jo {{petals.cap}}.'
  en: 'A date invitation takes {{petals.set_cost}} sparks. They go as soon as you start the invitation, before you choose who to invite. If no suitable candidates can be found, your sparks stay put. You can hold {{petals.cap}} sparks at a time, enough for {{petals.cap_roses}} invitations, and after that new ones wait until you send one. Refunds arrive even when you already have {{petals.cap}}.'

'economy.lead':
  fi: '{{petals.set_cost}} kipinää, yksi treffikutsu.'
  en: '{{petals.set_cost}} sparks, one date invitation.'

'economy.spark.alt':
  fi: 'Pilkkeen kipinälaskuri, jossa on viisi kipinää, yhden treffikutsun verran.'
  en: 'Pilke’s spark counter with five sparks, enough for one date invitation.'

'economy.amount.one':
  fi: '1 kipinä'
  en: '1 spark'

'economy.amount.two':
  fi: '2 kipinää'
  en: '2 sparks'

'economy.amount.five':
  fi: '5 kipinää'
  en: '5 sparks'

# ──────────────────────────────────────────────────────────────────────────
# When plans change
# ──────────────────────────────────────────────────────────────────────────

'detail.changes.title':
  fi: 'Jos suunnitelmat muuttuvat'
  en: 'If plans change'

'detail.changes.expired':
  fi: 'Kutsuun ei vastata vuorokaudessa'
  en: 'An invitation goes unanswered for a day'

'detail.changes.expired.note':
  fi: 'Kutsu raukeaa itsestään, ja kipinäsi palaavat sinulle. Vastaamatta jättänyt saa {{cooldown.no_answer_hours}} tunnin jäähyn, jonka aikana hän ei voi löytää uusia ehdokkaita.'
  en: 'It lapses by itself and your sparks come back to you. Whoever left it unanswered gets a {{cooldown.no_answer_hours}}-hour cooldown, during which they cannot find new candidates.'

'detail.changes.declined':
  fi: 'Kutsu hylätään'
  en: 'An invitation is turned down'

'detail.changes.declined.note':
  fi: 'Kipinäsi palaavat sinulle. Kutsun hylännyt saa {{cooldown.decline_hours}} tunnin jäähyn, jonka aikana hän ei voi löytää uusia ehdokkaita.'
  en: 'Your sparks come back to you. Whoever declined gets a {{cooldown.decline_hours}}-hour cooldown, during which they cannot find new candidates.'

'detail.changes.withdrawn':
  fi: 'Perut oman kutsusi'
  en: 'You withdraw your own invitation'

'detail.changes.withdrawn.note':
  fi: 'Kipinät jäävät käytetyiksi, ja saat {{cooldown.withdrawal_hours}} tunnin jäähyn, jonka aikana et voi löytää uusia ehdokkaita.'
  en: 'The sparks stay spent, and you get a {{cooldown.withdrawal_hours}}-hour cooldown, during which you cannot find new candidates.'

'detail.changes.canceled':
  fi: 'Sovitut treffit perutaan'
  en: 'An agreed date is called off'

'detail.changes.canceled.note':
  fi: 'Voit perua, mutta se on toiselle epäkohteliasta: hän on varannut aikaa sinulle. Perumisesta seuraa jäähy, jonka aikana et näy muiden ehdokkaissa etkä pääse löytämään uusia ehdokkaita. Mitä lähempänä treffit ovat ja mitä useammin perut, sitä pidempään se kestää. Jos kutsuttu peruu, kutsuja saa kipinänsä takaisin.'
  en: 'You can, but it is rude to the other person: they have set time aside for you. Calling it off brings a cooldown, during which you do not appear among other people’s candidates and cannot find new ones. The closer the date and the more often you call dates off, the longer it lasts. If the person invited calls it off, the sender gets their sparks back.'

# ──────────────────────────────────────────────────────────────────────────
# Why there is no chat
# ──────────────────────────────────────────────────────────────────────────

'detail.chat.title':
  fi: 'Miksi chattia ei ole'
  en: 'Why there is no chat'

'detail.chat.body':
  fi: 'Chättäily sovelluksessa on oikeastaan turha rituaali ennen treffejä, joilla vasta pääsee tapaamaan toisen ja juttelemaan kunnolla. Pilke hyppää suoraan siihen: kutsussa on jo aika ja paikka, ja juttu alkaa samassa pöydässä. Treffipäivänä kartta näyttää, missä toinen on, joten löydätte toisenne ilman viestejä.'
  en: 'Chatting in an app is really just an unnecessary ritual before the date, which is where you actually get to meet and talk. Pilke skips straight to the good part: the invitation already has the time and the place, and the talking starts at the same table. On the day, the map shows where the other person is, so you find each other without messaging.'
