# House style, and what this format is for, is the header of `site.yaml`.
#
# WARNING: **Every number on this page is a backend constant.** Five kipinää for an
# invitation, fifteen held at a time, one hour of shared calendar, at least two times
# offered, a day to answer. The size of a set is deliberately not one of them: what
# the copy emphasises is that the reader picks who the invitation goes to, not how
# many faces they are picking from. They are cited in `README.md`, and a marketing
# page stating a price the product does not charge is worse than a page that stays
# vague.

# ──────────────────────────────────────────────────────────────────────────
# The page itself
# ──────────────────────────────────────────────────────────────────────────

# The detail page. Every number here is the backend's own constant, and the
# README records which.
'detail.title':
  fi: 'Näin Pilke toimii'
  en: 'How Pilke works'

'detail.lead':
  fi: 'Pilke on todella erilainen verrattuna muihin deittisovelluksiin. Tällä sivulla pyrimme selventämään Pilkkeen toimintaa.'
  en: 'Pilke is very different from other dating apps. This page explains how it works.'

# ──────────────────────────────────────────────────────────────────────────
# Before the first invitation
# ──────────────────────────────────────────────────────────────────────────

'detail.start.title':
  fi: 'Ennen ensimmäistä treffikutsua'
  en: 'Before your first date invitation'

'detail.start.body':
  fi: 'Luodessasi tiliä kerrot itsestäsi ja toiveistasi ja vastaat lyhyeen persoonallisuuskyselyyn, jonka vastauksia käytetään sopivien ehdokkaiden löytämiseen.'
  en: 'When you create your account, you tell us about yourself and what you are looking for, and answer a short personality quiz. Its answers are used to find you suitable candidates.'

'detail.prefs.title':
  fi: 'Treffipaikat ja kalenteri'
  en: 'Date venues and calendar'

'detail.prefs.body':
  fi: 'Valitse erityylisistä treffipaikoista itsellesi mieluisat, ja merkitse kartalle minne olisit valmis menemään. Kalenteriin merkitset ne ajat, jolloin sinulle sopisi käydä treffeillä.'
  en: 'Choose the kinds of date venues you like, and mark on the map where you would be happy to go. In the calendar you mark the times when you could go on a date.'

# ──────────────────────────────────────────────────────────────────────────
# Kipinät
#
# `economy.amount.*` are the amounts in the earning table, and `economy.lead`
# and `economy.spark.alt` belong to the lit sparkle drawn beside it.
# ──────────────────────────────────────────────────────────────────────────

'detail.economy.title':
  fi: 'Kipinät'
  en: 'Sparks'

'detail.economy.body':
  fi: 'Pilke pyörii kipinöillä. Kipinät on suunniteltu tarjoamaan jokaiselle käyttäjälle vuorotellen mahdollisuus kutsun lähettämiseen, sekä kannustamaan treffeillä käymiseen ja kalenterin ylläpitämiseen.'
  en: 'Pilke runs on sparks. They are designed to give every user a turn at sending an invitation, and to encourage going on dates and keeping your calendar up to date.'

'detail.economy.earn':
  fi: 'Näin kipinöitä kertyy'
  en: 'How sparks add up'

'detail.earn.date':
  fi: 'Treffeillä käyminen'
  en: 'Going on dates'

'detail.earn.date.note':
  fi: 'Ansaitset kipinät heti treffien jälkeen, täytettyäsi treffipalautteen.'
  en: 'You earn the sparks right after the date, once you have filled in the date feedback.'

'detail.earn.calendar':
  fi: 'Kalenterin ylläpitäminen'
  en: 'Keeping your calendar up to date'

'detail.earn.calendar.note':
  fi: 'Yhden kipinän ansaitseminen tarvitsee {{calendar.petal_week_hours}} tuntia kalenterissa viikon ajan. Mukaan lasketaan seuraavan {{calendar.earning_horizon_days}} päivän ajat, kerrallaan enintään {{calendar.counted_hours_cap}} tuntia. Viikossa kipinöitä kertyy siis kalenterista enintään {{calendar.max_petals_per_week}}.'
  en: 'Earning one spark takes {{calendar.petal_week_hours}} hours in your calendar, kept for a week. Times in the next {{calendar.earning_horizon_days}} days count, up to {{calendar.counted_hours_cap}} hours at once, so your calendar brings at most {{calendar.max_petals_per_week}} sparks a week.'

'detail.economy.spend':
  fi: 'Näin käytät kipinöitä'
  en: 'How you use sparks'

'detail.economy.spend.body':
  fi: 'Treffikutsuun kuluu {{petals.set_cost}} kipinää, heti hakiessasi ehdokkaat. Jos sopivia ehdokkaita ei löydy, esimerkiksi liian tyhjän kalenterin takia, kipinäsi palautetaan. Kipinöitä voi olla kerättynä korkeintaan {{petals.cap}}, eli {{petals.cap_roses}} kutsun verran.'
  en: 'A date invitation takes {{petals.set_cost}} sparks, as soon as you look for candidates. If no suitable candidates can be found, for example because your calendar is too empty, your sparks are refunded. You can collect at most {{petals.cap}} sparks, enough for {{petals.cap_roses}} invitations.'

'economy.lead':
  fi: '{{petals.set_cost}} kipinää, yksi treffikutsu.'
  en: '{{petals.set_cost}} sparks, one date invitation.'

'economy.spark.alt':
  fi: 'Pilkkeen kipinälaskuri, jossa on viisi kipinää, yhden treffikutsun verran.'
  en: 'Pilke’s spark counter with five sparks, enough for one date invitation.'

'economy.amount.one':
  fi: '1-4 kipinää'
  en: '1-4 sparks'

'economy.amount.two':
  fi: '2 kipinää'
  en: '2 sparks'

# ──────────────────────────────────────────────────────────────────────────
# How candidates are chosen, and the invitation
# ──────────────────────────────────────────────────────────────────────────

'detail.draw.title':
  fi: 'Miten ehdokkaat valitaan'
  en: 'How candidates are chosen'

'detail.draw.body':
  fi: 'Pilke suodattaa ehdokkaat toiveidesi mukaan. Lisäksi jokaisella ehdokkaalla on varmasti kalenterissa yhteistä vapaata aikaa, ja heille sopii jokin yhteinen treffipaikka kanssasi.'
  en: 'Pilke filters candidates by your wishes. On top of that, every candidate is sure to share free time with you in your calendars, and a date venue that suits you both.'

'detail.invite.title':
  fi: 'Kutsu ja vastaus'
  en: 'The invitation and the answer'

'detail.invite.body':
  fi: 'Tarjoa treffiehdokkaalle yhteisistä ajoistanne ja paikoistanne ne, jotka sopivat parhaiten sinulle. Treffien varmistumiseksi kutsussa on oltava vähintään {{invitation.choice_threshold}} aikaa tai {{invitation.choice_threshold}} paikkaa. Kutsun vastaanottaja valitsee lopullisen ajan ja paikan, ja treffit on sovittu. Kutsuun on vastattava {{invitation.answer_hours}} tunnissa, tai se vanhenee.'
  en: 'Offer your candidate the shared times and places that suit you best. For the date to be set, an invitation has to hold at least {{invitation.choice_threshold}} times or {{invitation.choice_threshold}} places. The person you invite picks the final time and place, and the date is set. An invitation has to be answered within {{invitation.answer_hours}} hours, or it expires.'

# ──────────────────────────────────────────────────────────────────────────
# Enjoying the date
#
# `photo.coffee` is the alt text of the photograph under it, a stock photo whose
# faces are out of the frame; `docs/pictures.md` records where it is from.
# ──────────────────────────────────────────────────────────────────────────

'detail.enjoy.title':
  fi: 'Nauttikaa treffeistä!'
  en: 'Enjoy your date!'

'detail.enjoy.body':
  fi: 'Aika ja paikka on jo sovittu, joten voitte keskittyä toisiinne. Tilatkaa kahvit, kysykää ja kuunnelkaa. Treffien jälkeen kerrot palautteessa, miten meni.'
  en: 'The time and the place are already settled, so you can focus on each other. Order a coffee, ask questions and listen. Afterwards, tell us in the feedback how it went.'

'photo.coffee':
  fi: 'Kaksi ihmistä kahvilla puupöydän ääressä, toisen käsi toisen kädellä.'
  en: 'Two people over coffee at a wooden table, one hand resting on the other’s.'

# ──────────────────────────────────────────────────────────────────────────
# When plans change
# ──────────────────────────────────────────────────────────────────────────

'detail.changes.title':
  fi: 'Joskus suunnitelmat muuttuvat'
  en: 'Sometimes plans change'

'detail.changes.expired':
  fi: 'Mitä jos kutsuuni ei vastata vuorokaudessa?'
  en: 'What if my invitation goes unanswered for a day?'

'detail.changes.expired.note':
  fi: 'Kutsu raukeaa itsestään, ja kipinäsi palautetaan. Vastaamatta jättänyt käyttäjä saa {{cooldown.no_answer_hours}} tunnin jäähyn, jonka aikana hän ei voi löytää uusia ehdokkaita.'
  en: 'The invitation lapses by itself, and your sparks are refunded. The person who left it unanswered gets a {{cooldown.no_answer_hours}}-hour cooldown, during which they cannot find new candidates.'

'detail.changes.declined':
  fi: 'Mitä jos lähettämäni kutsu hylätään?'
  en: 'What if my invitation is turned down?'

'detail.changes.declined.note':
  fi: 'Kipinäsi palautetaan. Kutsun hylännyt käyttäjä saa {{cooldown.decline_hours}} tunnin jäähyn, jonka aikana hän ei voi löytää uusia ehdokkaita.'
  en: 'Your sparks are refunded. The person who declined gets a {{cooldown.decline_hours}}-hour cooldown, during which they cannot find new candidates.'

'detail.changes.withdrawn':
  fi: 'Mitä jos perun lähettämäni kutsun?'
  en: 'What if I withdraw an invitation I sent?'

'detail.changes.withdrawn.note':
  fi: 'Kipinöitä ei palauteta, ja saat {{cooldown.withdrawal_hours}} tunnin jäähyn, jonka aikana et voi löytää uusia ehdokkaita.'
  en: 'Your sparks are not refunded, and you get a {{cooldown.withdrawal_hours}}-hour cooldown, during which you cannot find new candidates.'

'detail.changes.canceled':
  fi: 'Mitä jos jompikumpi peruu sovitut treffit?'
  en: 'What if one of us calls off an agreed date?'

'detail.changes.canceled.note':
  fi: 'Perumisesta seuraa jäähy, jonka aikana et näy muiden ehdokkaissa etkä pääse löytämään uusia ehdokkaita. Mitä lähempänä treffit ovat ja mitä useammin perut, sitä pidempään se kestää. Jos kutsuttu peruu, kutsuja saa kipinänsä takaisin.'
  en: 'Calling it off brings a cooldown, during which you do not appear among other people’s candidates and cannot find new ones. The closer the date and the more often you call dates off, the longer it lasts. If the person invited calls it off, the sender gets their sparks back.'

'detail.changes.noshow':
  fi: 'Mitä jos toinen ei saavu treffeille?'
  en: 'What if the other person doesn’t turn up for the date?'

'detail.changes.noshow.note':
  fi: 'Jos tiedät, ettet syystä tai toisesta pääse paikalle, peru treffit pikimmiten. Sovituille treffeille saapumatta jättäminen on käyttöehtojen vastaista (puhumattakaan kusipäisyydestä), ja tällainen käytös johtaa hyvin nopeasti sovelluksen käyttökieltoon.'
  en: 'If you know you can’t make it for one reason or another, call the date off as soon as you can. Not turning up for an agreed date is against the terms of use (not to mention a jerk move), and it very quickly gets you banned from the app.'

# ──────────────────────────────────────────────────────────────────────────
# Why there is no chat
# ──────────────────────────────────────────────────────────────────────────

'detail.chat.title':
  fi: 'Miksi chattia ei ole'
  en: 'Why there is no chat'

'detail.chat.body':
  fi: 'Chättäilysovelluksia on jo lukuisia. Se on mielestämme oikeastaan turha rituaali ennen treffejä, joilla vasta pääsee tapaamaan toisen ja juttelemaan kunnolla. Pilkkeellä hyppäät suoraan asiaan: jokaisessa treffikutsussa on jo aika ja paikka, ja pääset juttelemaan potentiaaliselle kumppanille kasvotusten ilman viestivastausten odottelua.'
  en: 'There are plenty of chat apps already. We think chatting is really just an unnecessary ritual before the date, which is where you actually get to meet and talk. With Pilke you skip straight to it: every date invitation already has the time and the place, and you get to talk to a potential partner face to face, with no waiting for replies.'
