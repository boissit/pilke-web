# House style, and what this format is for, is the header of `site.yaml`.
#
# WARNING: **Every number on this page is a backend constant.** Five kipinää for an
# invitation, fifteen held at a time, one hour of shared calendar, at least two times
# offered, a day to answer. The size of a set is deliberately not one of them: what
# the copy emphasises is that the reader picks who the invitation goes to, not how
# many faces they are picking from. They are cited in `README.md`, and a marketing
# page stating a price the product does not charge is worse than a page that stays
# vague.

# ──────────────────────────────────────────────────────────────────────────
# The page itself
# ──────────────────────────────────────────────────────────────────────────

# The detail page. Every number here is the backend's own constant, and the
# README records which.
'detail.title':
  fi: 'Näin Pilke toimii'
  en: 'How Pilke works'

'detail.lead':
  fi: 'Pilke on todella erilainen verrattuna muihin deittisovelluksiin. Tällä sivulla pyrimme selventämään Pilkkeen toimintaa.'
  en: 'Pilke is very different from other dating apps. Here’s how it works.'

# ──────────────────────────────────────────────────────────────────────────
# Before the first invitation
# ──────────────────────────────────────────────────────────────────────────

'detail.start.title':
  fi: 'Ennen ensimmäistä treffikutsua'
  en: 'Before your first invite'

'detail.start.body':
  fi: 'Luodessasi tiliä kerrot itsestäsi ja toiveistasi ja vastaat lyhyeen persoonallisuuskyselyyn, jonka vastauksia käytetään sopivien ehdokkaiden löytämiseen.'
  en: 'When you sign up, you tell us about yourself and who you’d like to meet, and take a short personality quiz. We use your answers to find people who suit you.'

'detail.prefs.title':
  fi: 'Treffipaikat ja kalenteri'
  en: 'Places and times'

'detail.prefs.body':
  fi: 'Valitse erityylisistä treffipaikoista itsellesi mieluisat ja merkitse kartalla minne olisit valmis menemään. Kalenteriin merkitset sinulle sopivat treffiajat.'
  en: 'Pick the kinds of places you’d like to go, and mark on the map where you can get to. Then mark the times you’re free in your calendar.'

# ──────────────────────────────────────────────────────────────────────────
# How candidates are chosen, and the invitation
#
# `draw.body` is the owner's: what filters the candidates, and what the feedback
# after each date teaches the matcher, about the reader and about who they suit.
# ──────────────────────────────────────────────────────────────────────────

'detail.draw.title':
  fi: 'Miten ehdokkaat valitaan'
  en: 'How we pick your matches'

'detail.draw.body':
  fi: 'Pilke suodattaa ehdokkaat toiveidenne ja teille molemmille sopivien aikojen ja treffipaikkojen perusteella. Jokaisten treffien jälkeen kerrot, mistä pidit ja mitä jäit kaipaamaan kumppanissasi. Pilke oppii palautteestasi, millaisista ihmisistä pidät ja kenelle sinä sovit.'
  en: 'Pilke matches you with people who want what you want, and who are free at the same times and places as you. After each date, you tell us what you liked about the person and what was missing. Pilke learns from this what kind of people you like and who you’re a good match for.'

'detail.invite.title':
  fi: 'Kutsu ja vastaus'
  en: 'Inviting and being invited'

'detail.invite.body':
  fi: 'Tarjoa valitsemallesi ehdokkaalle yhteisistä ajoistanne ja paikoistanne suosikkisi. Kutsussa on oltava vähintään {{invitation.choice_threshold}} aikaa tai {{invitation.choice_threshold}} paikkaa. Kutsun vastaanottaja valitsee lopullisen ajan ja paikan, ja treffinne on sovittu. Kutsuun on vastattava {{invitation.answer_hours}} tunnissa, tai se vanhenee.'
  en: 'Pick someone and send them your favourite options from the times and places that work for both of you. You need to offer at least {{invitation.choice_threshold}} times or {{invitation.choice_threshold}} places. They choose one of each, and it’s a date. They have {{invitation.answer_hours}} hours to reply, or the invite expires.'

# ──────────────────────────────────────────────────────────────────────────
# Kipinät
#
# `economy.amount.*` are the amounts in the earning table, and `economy.lead`
# and `economy.spark.alt` belong to the lit sparkle drawn beside it.
# ──────────────────────────────────────────────────────────────────────────

'detail.economy.title':
  fi: 'Kipinät'
  en: 'Sparks'

'detail.economy.body':
  fi: 'Deittailu vaatii kipinää. Pilkkeessä kipinöitä kuluu kutsujen lähettämiseen, mutta niitä saa kalenterin ylläpitämisestä ja treffeillä käymisestä, eli aktiivisuus kannattaa! Kipinöitä ei voi ostaa rahalla.'
  en: 'Every date needs a spark. On Pilke, you spend sparks on invites, and you earn them by going on dates and keeping your calendar up to date. Being active pays off, since you can’t buy sparks.'

'detail.economy.earn':
  fi: 'Näin kipinöitä kertyy'
  en: 'Earning sparks'

'detail.earn.date':
  fi: 'Treffeillä käyminen'
  en: 'Going on dates'

'detail.earn.date.note':
  fi: 'Ansaitset kipinät heti treffien jälkeen, täytettyäsi treffipalautteen.'
  en: 'You get them as soon as you’ve filled in your feedback after the date.'

'detail.earn.calendar':
  fi: 'Kalenterin ylläpitäminen'
  en: 'Keeping your calendar up to date'

'detail.earn.calendar.note':
  fi: 'Kalenterimerkinnät tuottavat kipinöitä matalalla, mutta jatkuvalla tahdilla. {{calendar.petal_week_hours}} tunnin viikko tuottaa yhden kokonaisen kipinän ja {{calendar.counted_hours_cap}} tunnin viikko {{calendar.max_petals_per_week}} kipinän maksimin. Kipinätuotanto lasketaan seuraavan {{calendar.earning_horizon_days}} päivän ajalta.'
  en: "Free time in your calendar earns sparks slowly but steadily: {{calendar.petal_week_hours}} free hours a week earns one spark, and {{calendar.counted_hours_cap}} or more earns the maximum of {{calendar.max_petals_per_week}}. This is based on the hours you’ve marked free for the next {{calendar.earning_horizon_days}} days."

'detail.economy.spend':
  fi: 'Näin käytät kipinöitä'
  en: 'Spending sparks'

'detail.economy.spend.body':
  fi: 'Treffikutsu kuluttaa {{petals.set_cost}} kipinää heti, kun näet ehdokkaasi. Jos Pilke ei pysty tarjoilemaan vähintään {{candidates.per_set}} ehdokasta, esimerkiksi liian tyhjän kalenterin takia, kipinäsi palautetaan.'
  en: 'The {{petals.set_cost}} sparks for an invite are taken as soon as you see your matches. If Pilke can’t find at least {{candidates.per_set}} people for you, for example because your calendar is too empty, you get them back.'

# Under the price, in the card's left column: how many sparks can be held at once.
# (`earn.calendar.note`'s English joins each number to its "hour" with a
# non-breaking hyphen, so a phone never breaks "10-" from "hour".)
'detail.economy.cap':
  fi: 'Kipinöitä voi olla kerättynä korkeintaan {{petals.cap}}, eli {{petals.cap_roses}} kutsun verran.'
  en: 'You can hold up to {{petals.cap}}, which is enough for {{petals.cap_roses}} invites.'

'economy.lead':
  fi: '{{petals.set_cost}} kipinää, yksi treffikutsu.'
  en: 'An invite costs {{petals.set_cost}} sparks.'

'economy.spark.alt':
  fi: 'Pilkkeen kipinälaskuri, jossa on viisi kipinää, yhden treffikutsun verran.'
  en: 'Pilke’s spark counter with five sparks, enough for one invite.'

'economy.amount.one':
  fi: '1-4 kipinää'
  en: '1-4 sparks'

'economy.amount.two':
  fi: '2 kipinää'
  en: '2 sparks'

# ──────────────────────────────────────────────────────────────────────────
# Enjoying the date
#
# A heading and a photograph, no paragraph: the picture says it. `photo.date` is
# its alt text, a stock photo of two people too small to recognise;
# `docs/pictures.md` records where it is from.
# ──────────────────────────────────────────────────────────────────────────

'detail.enjoy.title':
  fi: 'Nauttikaa treffeistä!'
  en: 'Enjoy your date!'

'photo.date':
  fi: 'Kaksi ihmistä juttelee penkillä puutarhassa. Toinen nauraa käsi suun edessä, toinen nojaa häntä kohti.'
  en: 'Two people talk on a bench in a garden. One laughs behind a hand, the other leans in.'

# ──────────────────────────────────────────────────────────────────────────
# After the date
#
# A draft of the owner's, open to their edit. "Treffikumppanisi ei näe
# vastauksiasi" is checked against `feedback.meet_again`: nothing anybody answers
# is shown to the other party, and the one answer that does anything between the two
# is the phone number, exchanged only when both chose it, which the next sentence
# says. The sparks are `{{sparks.per_date}}`, given once the feedback is in.
# ──────────────────────────────────────────────────────────────────────────

'detail.after.title':
  fi: 'Treffien jälkeen'
  en: 'After the date'

'detail.after.body':
  fi: 'Vastaa lyhyeen treffipalautteeseen: miten treffit sujuivat, mistä pidit ja mitä jäit kaipaamaan. Treffikumppanisi ei näe vastauksiasi. Jos treffit menivät hyvin, voitte vaihtaa puhelinnumerot ja jatkaa Pilkkeen ulkopuolella. Palautteen täytettyäsi saat kipinät, ja seuraavat ehdokkaat osuvat entistä paremmin.'
  en: 'Answer a few quick questions: how it went, what you liked and what was missing. Your date won’t see your answers. If it went well, swap numbers and take it from there. Once you’ve given feedback, you get your sparks, and your next matches get even better.'

# ──────────────────────────────────────────────────────────────────────────
# When plans change
# ──────────────────────────────────────────────────────────────────────────

'detail.changes.title':
  fi: 'Joskus suunnitelmat muuttuvat'
  en: 'When plans change'

'detail.changes.expired':
  fi: 'Mitä jos kutsuuni ei vastata vuorokaudessa?'
  en: 'What if nobody answers my invite?'

'detail.changes.expired.note':
  fi: 'Kutsu raukeaa itsestään, ja kipinäsi palautetaan. Vastaamatta jättänyt käyttäjä saa {{cooldown.no_answer_hours}} tunnin jäähyn, jonka aikana hän ei voi löytää uusia ehdokkaita.'
  en: 'After {{invitation.answer_hours}} hours it expires and you get your sparks back. The person who didn’t reply can’t look for new matches for {{cooldown.no_answer_hours}} hours.'

'detail.changes.declined':
  fi: 'Mitä jos lähettämäni kutsu hylätään?'
  en: 'What if my invite is declined?'

'detail.changes.declined.note':
  fi: 'Kipinäsi palautetaan. Kutsun hylännyt käyttäjä saa {{cooldown.decline_hours}} tunnin jäähyn, jonka aikana hän ei voi löytää uusia ehdokkaita.'
  en: 'You get your sparks back. The person who declined can’t look for new matches for {{cooldown.decline_hours}} hours.'

'detail.changes.withdrawn':
  fi: 'Mitä jos perun lähettämäni kutsun?'
  en: 'What if I withdraw my invite?'

'detail.changes.withdrawn.note':
  fi: 'Kipinöitä ei palauteta, ja saat {{cooldown.withdrawal_hours}} tunnin jäähyn, jonka aikana et voi löytää uusia ehdokkaita.'
  en: 'You don’t get your sparks back, and you can’t look for new matches for {{cooldown.withdrawal_hours}} hours.'

'detail.changes.canceled':
  fi: 'Mitä jos jompikumpi peruu sovitut treffit?'
  en: 'What if one of us cancels a date?'

'detail.changes.canceled.note':
  fi: 'Perumisesta seuraa jäähy, jonka aikana et näy muiden ehdokkaissa etkä pääse löytämään uusia ehdokkaita. Mitä lähempänä treffit ovat ja mitä useammin perut, sitä pidempään se kestää. Jos kutsuttu peruu, kutsuja saa kipinänsä takaisin.'
  en: 'Whoever cancels can’t look for new matches, and won’t be shown to anyone else, for a while. The later you cancel and the more often you do it, the longer that lasts. If the person who was invited cancels, the sender gets their sparks back.'

'detail.changes.noshow':
  fi: 'Mitä jos toinen ei saavu treffeille?'
  en: 'What if I can’t make it?'

'detail.changes.noshow.note':
  fi: 'Jos tiedät, ettet syystä tai toisesta pääse paikalle, peru treffit pikimmiten. Sovituille treffeille saapumatta jättäminen on käyttöehtojen vastaista (puhumattakaan kusipäisyydestä), ja tällainen käytös johtaa hyvin nopeasti sovelluksen käyttökieltoon.'
  en: 'Cancel as soon as you know. Not turning up to a date you agreed to is against our terms of use (not to mention a jerk move), and it’ll get you banned fast.'

# ──────────────────────────────────────────────────────────────────────────
# Why there is no chat
# ──────────────────────────────────────────────────────────────────────────

'detail.chat.title':
  fi: 'Miksi chattia ei ole'
  en: 'Why there’s no chat'

'detail.chat.body':
  fi: 'Chättäilysovelluksia on jo lukuisia. Se on mielestämme oikeastaan turha rituaali ennen treffejä, joilla vasta pääsee tapaamaan toisen ja juttelemaan kunnolla. Pilkkeellä hyppäät suoraan asiaan: jokaisessa treffikutsussa on jo aika ja paikka, ja pääset juttelemaan potentiaaliselle kumppanille kasvotusten ilman viestivastausten odottelua.'
  en: 'There are plenty of chat apps already. We think chatting is mostly a pointless warm-up before the date, which is where you actually get to meet and talk. Pilke skips straight to that: every invite already has a time and a place, and you get to talk face to face without waiting for replies.'

# A draft line of the owner's, which they may still drop: its own key, so dropping
# it is one deletion here and one in the page.
'detail.chat.wishes':
  fi: 'Ehdokkaat on jo valittu toiveidesi mukaan, joten turhilta treffeiltä välttyy ilman viestittelyäkin.'
  en: 'Your matches are already picked to fit what you’re looking for, so you can avoid bad dates without messaging first.'
