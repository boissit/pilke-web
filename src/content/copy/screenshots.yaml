# House style, and what this format is for, is the header of `site.yaml`.
#
# Alt text for the screenshots, one entry per picture a page draws in a `Phone` from
# `src/assets/screens.ts`. The front page's two photographs are in `etusivu.yaml`, and
# the guide's stills carry their alt text in their own Markdown.
#
# Grouped by picture rather than by page because several pages draw the same
# screen, and the alt text follows the picture: `invitation`, `date` and `feedback`
# are on both the front page and `nain-se-toimii`.
#
# WARNING: **These describe a still of a real build.** When the app changes, the
# description can go stale silently — `docs/pictures.md` is the account of which
# page draws which screen and what each one shows.

# ──────────────────────────────────────────────────────────────────────────
# One per screen
# ──────────────────────────────────────────────────────────────────────────

