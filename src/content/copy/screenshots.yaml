# House style, and what this format is for, is the header of `site.yaml`.
#
# WARNING: **The site does not read this file yet.** `src/i18n/ui.ts` is still what
# every page renders from.
#
# Alt text for the screenshots, one entry per picture in `src/assets/screens.ts`.
#
# Grouped by picture rather than by page because several pages draw the same
# screen, and the alt text follows the picture: `platter` and `date` are on both
# the front page and `nain-se-toimii`, and `asetukset` is on the front page and
# `turvallisuus`.
#
# WARNING: **These describe a still of a real build.** When the app changes, the
# description can go stale silently — `docs/pictures.md` is the account of which
# page draws which screen and what each one shows.

# ──────────────────────────────────────────────────────────────────────────
# One per screen
# ──────────────────────────────────────────────────────────────────────────

