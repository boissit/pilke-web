# House style, and what this format is for, is the header of `site.yaml`.
#
# WARNING: **The site does not read this file yet.** `src/i18n/ui.ts` is still what
# every page renders from.
#
# WARNING: **This page states only what the app does.** It names the trusted
# contact, the safety button and the report because those exist and ship. It
# promises nothing about what Pilke will do on somebody's behalf, and the advice
# below is ordinary meeting-safely sense rather than anything the product
# enforces. Read `README.md` before adding a claim here.

# ──────────────────────────────────────────────────────────────────────────
# The page itself
#
# `safety.more` is the label of the link *to* this page, and three other pages
# use it — the front page, `nain-se-toimii` and `kysyttya`. It is here rather
# than with any one of them so that the page and its own name are one edit.
# ──────────────────────────────────────────────────────────────────────────

'safety.title':
  fi: 'Turvallisuus'
  en: 'Safety'

'safety.more':
  fi: 'Lue turvallisuudesta'
  en: 'Read about safety'

'safety.page.lead':
  fi: 'Tuntemattoman tapaaminen on eri asia kuin viestittely. Tältä sivulta näet, mitä Pilke tekee turvallisuutesi eteen ja mitä kannattaa tehdä itse.'
  en: 'Meeting a stranger is a different thing from messaging one. This page covers what Pilke does for your safety and what is worth doing yourself.'

# ──────────────────────────────────────────────────────────────────────────
# The three tools
#
# Longer than the front page’s cards, and the third one is the report rather
# than the location window.
# ──────────────────────────────────────────────────────────────────────────

'safety.contact.title':
  fi: 'Luotettava läheinen'
  en: 'A trusted person'

'safety.contact.body':
  fi: 'Tallenna asetusten Turvallisuus-kohtaan yhden läheisesi puhelinnumero ja sovi asiasta hänen kanssaan etukäteen. Se on ainoa numero, johon sovellus voi lähettää viestin puolestasi.'
  en: 'Save one trusted person’s phone number under Safety in the settings, and agree it with them beforehand. It is the only number the app can text on your behalf.'

'safety.button.title':
  fi: 'Turvapainike'
  en: 'The safety button'

'safety.button.body':
  fi: 'Turvapainike ilmestyy treffinäytölle, kun olet tallentanut luotettavan läheisen numeron, joten tallenna se etukäteen. Yksi painallus lähettää hänelle tekstiviestin, jossa on nimesi ja pyyntö ottaa sinuun yhteyttä. Sijaintisi, treffipaikka, kellonaika ja tiedot treffikumppanistasi jäävät viestistä pois. Treffikumppanisi ei saa tietää painalluksesta.'
  en: 'The safety button appears on the date screen once you have saved a trusted person’s number, so save it beforehand. One press texts them your name and a request to get in touch. Your location, the venue, the time and anything about your date are left out of the message. Your date is not told about the press.'

'safety.report.title':
  fi: 'Ilmoitus'
  en: 'Reporting'

'safety.report.body':
  fi: 'Jos olosi oli treffeillä turvaton, kerro siitä treffien jälkeisessä palautteessa, halutessasi omin sanoin. Ilmoitus menee Pilkkeen työntekijöille, ja vain he lukevat sen. Luemme sen niin pian kuin mahdollista.'
  en: 'If you did not feel safe on the date, say so in the feedback afterwards, in your own words if you like. The report goes to Pilke staff, and only they read it. We read it as soon as we can.'

# ──────────────────────────────────────────────────────────────────────────
# Meeting somebody safely
# ──────────────────────────────────────────────────────────────────────────

'tips.title':
  fi: 'Näin tapaat turvallisesti'
  en: 'Meeting somebody safely'

'tips.lead':
  fi: 'Tavallista järkeä, joka unohtuu helposti, kun jännittää.'
  en: 'Ordinary sense, and easy to forget when you are nervous.'

'tips.one':
  fi: 'Tallenna luotettavan läheisen numero ennen ensimmäisiä treffejä.'
  en: 'Save a trusted person before your first date.'

'tips.two':
  fi: 'Kerro jollekin minne menet ja milloin arvioit olevasi kotona.'
  en: 'Tell somebody where you are going and when you expect to be home.'

'tips.three':
  fi: 'Valitse ensimmäisille treffeille paikka, jossa on muita ihmisiä.'
  en: 'Pick somewhere with other people around for a first date.'

'tips.four':
  fi: 'Mene treffeille ja tule kotiin omin kyydein.'
  en: 'Arrange your own way there and your own way back.'

'tips.five':
  fi: 'Pidä puhelin ladattuna.'
  en: 'Keep your phone charged.'

'tips.six':
  fi: 'Jos olo on epämukava, lähde. Sinun ei tarvitse selittää sitä kenellekään, ei meillekään.'
  en: 'If you feel uncomfortable, leave. You do not owe anybody an explanation for it, us included.'

# ──────────────────────────────────────────────────────────────────────────
# Location and privacy
# ──────────────────────────────────────────────────────────────────────────

'privacy.title':
  fi: 'Sijainti ja yksityisyys'
  en: 'Location and privacy'

# Two paragraphs, because these are two different things and conflating them is
# how the earlier version came to claim something the app does not do. The area
# is a choice on a map; the position is a permission during a date.
'privacy.area':
  fi: 'Treffialueet valitset kartalta. Pilke on jakanut kartan valmiiksi alueisiin, ja sinä valitset niistä ne, joilla voisit käydä treffeillä. Treffipaikkoja ehdotetaan vain valitsemiltasi alueilta, joten kotiosoitettasi ei tarvita.'
  en: 'You choose your date areas on a map. Pilke has divided the map into areas, and you pick the ones where you could go on a date. Venues are suggested only inside the areas you choose, so we do not need your home address.'

'privacy.body':
  fi: 'Laitteesi sijaintia luetaan vain treffeillä ja vain, jos itse valitset jakaa sen. Jakaminen toimii {{sharing.lead_minutes}} minuuttia ennen sovittua alkamisaikaa ja {{sharing.trail_minutes}} minuuttia sen jälkeen ja vain {{sharing.radius_m}} metrin säteellä treffipaikasta, joten kotoa sinua ei voi paikantaa. Sijainnin näkee vain treffikumppanisi. Se poistetaan heti, kun aika umpeutuu, ja voit lopettaa jakamisen milloin tahansa.'
  en: 'Your device location is read only on a date, and only if you choose to share it. Sharing works from {{sharing.lead_minutes}} minutes before the agreed start to {{sharing.trail_minutes}} minutes after, and only within {{sharing.radius_m}} metres of the venue, so you cannot be located at home. Only your date sees it. It is deleted as soon as the window closes, and you can stop at any time.'
