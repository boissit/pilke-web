# House style, and what this format is for, is the header of `site.yaml`.
#
# WARNING: **This page states only what the app does.** It names the trusted
# contact, the safety button and the report because those exist and ship. It
# promises nothing about what Pilke will do on somebody's behalf, and the advice
# below is ordinary meeting-safely sense rather than anything the product
# enforces. Read `README.md` before adding a claim here.

# ──────────────────────────────────────────────────────────────────────────
# The page itself
#
# `safety.more` is the label of the link *to* this page, and three other pages
# use it — the front page, `nain-se-toimii` and `kysyttya`. It is here rather
# than with any one of them so that the page and its own name are one edit.
# ──────────────────────────────────────────────────────────────────────────

'safety.title':
  fi: 'Turvallisuus'
  en: 'Safety'

'safety.more':
  fi: 'Lue turvallisuudesta'
  en: 'Read about safety'

'safety.page.lead':
  fi: 'Treffien on oltava turvalliset, jotta ne voivat olla hauskat. Pidämme käyttäjämme turvassa tarkoin valikoiduilla treffipaikoilla, turvapainikkeella ja ilmiantomahdollisuuksilla.'
  en: 'A date has to be safe before it can be fun. We keep our users safe with carefully chosen date venues, the safety button and ways to report.'

# ──────────────────────────────────────────────────────────────────────────
# The tools
#
# In the order the lead names them. The trusted contact is part of the safety
# button, so it is said on the button's card rather than on a card of its own.
# ──────────────────────────────────────────────────────────────────────────

'safety.button.title':
  fi: 'Turvapainike'
  en: 'The safety button'

'safety.button.body':
  fi: 'Tiedät itse, kehen luotat eniten. Tallenna hänen numeronsa turvakontaktiksi ja saat treffien ajaksi käyttöösi turvapainikkeen, jota painamalla saat hänet tueksesi ennalta sopimallanne tavalla. Muista kertoa hänelle riittävät tiedot etukäteen!'
  en: 'You know best who you trust most. Save their number as your safety contact, and for the date you get a safety button: press it, and they are there for you in the way the two of you agreed in advance. Remember to tell them enough beforehand!'

'safety.report.title':
  fi: 'Ilmianto'
  en: 'Reporting'

# The owner's rewrite of this card says a report can also be made through the
# safety button. The button texts the trusted contact and reaches no staff yet, so
# the rewrite waits on https://github.com/boissit/treffit-backend/issues/40.
'safety.report.body':
  fi: 'Jos olosi treffeillä oli turvaton, kerro siitä treffien jälkeisessä palautteessa. Tästä syntyy ilmoitus Pilkkeen ylläpidolle, ja reagoimme siihen niin pian kuin mahdollista.'
  en: 'If you did not feel safe on the date, say so in the feedback afterwards. That sends a report to Pilke’s moderators, and we act on it as soon as we can.'

# ──────────────────────────────────────────────────────────────────────────
# Meeting somebody safely
# ──────────────────────────────────────────────────────────────────────────

'tips.title':
  fi: 'Turvallisten treffien perusteet'
  en: 'The basics of a safe date'

'tips.one':
  fi: 'Kerro turvahenkilöllesi treffeistä ja sopikaa yhdessä, mitä turvapainike tekee.'
  en: 'Tell your safety contact about the date, and agree together what the safety button does.'

'tips.two':
  fi: 'Valitse ensimmäisille treffeille paikka, jossa on muita ihmisiä.'
  en: 'Pick somewhere with other people around for a first date.'

'tips.three':
  fi: 'Vältä vakavia päihtymystiloja.'
  en: 'Avoid getting heavily intoxicated.'

'tips.four':
  fi: 'Mene treffeille ja palaa kotiin omin kyydein.'
  en: 'Make your own way to the date and your own way home.'

'tips.five':
  fi: 'Pidä puhelin ladattuna.'
  en: 'Keep your phone charged.'

# ──────────────────────────────────────────────────────────────────────────
# Location data
# ──────────────────────────────────────────────────────────────────────────

'privacy.title':
  fi: 'Sijaintitiedot'
  en: 'Location data'

'privacy.body':
  fi: 'Voimme auttaa sinua löytämään treffikumppanisi treffien alkaessa sijaintitietojen avulla. Sijaintitietoja jaetaan korkeintaan {{sharing.trail_minutes}} minuuttia treffien alkamisen jälkeen ja vain {{sharing.radius_m}} metrin säteellä treffikohteesta.'
  en: 'As the date starts, we can help you find your date with location data. Location data is shared for at most {{sharing.trail_minutes}} minutes after the date starts, and only within {{sharing.radius_m}} metres of the venue.'
