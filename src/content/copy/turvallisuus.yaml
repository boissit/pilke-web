# House style, and what this format is for, is the header of `site.yaml`.
#
# WARNING: **This page states only what the app does.** It names the trusted
# contact, the safety button and the report because those exist and ship. It
# promises nothing about what Pilke will do on somebody's behalf, and the advice
# below is ordinary meeting-safely sense rather than anything the product
# enforces. Read `README.md` before adding a claim here.

# ──────────────────────────────────────────────────────────────────────────
# The page itself
#
# `safety.more` is the label of the link *to* this page, and three other pages
# use it — the front page, `nain-se-toimii` and `kysyttya`. It is here rather
# than with any one of them so that the page and its own name are one edit.
# ──────────────────────────────────────────────────────────────────────────

'safety.title':
  fi: 'Turvallisuus'
  en: 'Safety'

'safety.more':
  fi: 'Lue turvallisuudesta'
  en: 'Read about safety'

'safety.page.lead':
  fi: 'Turvallisuus treffeillä on meille ykkösprioriteetti. Tästä syystä treffipaikat ovat kaikki ennaltamääriteltyjä, ja tarjoamme vinkkejä ja muita ominaisuuksia turvalliseen treffailuun.'
  en: 'Safety on dates is our top priority. That is why every date venue is set in advance, and we offer tips and other features for dating safely.'

# ──────────────────────────────────────────────────────────────────────────
# The three tools
#
# Longer than the front page’s cards, and the third one is the report rather
# than the location window.
# ──────────────────────────────────────────────────────────────────────────

'safety.contact.title':
  fi: 'Luotettava läheinen'
  en: 'A trusted person'

'safety.contact.body':
  fi: 'Tallenna asetusten Turvallisuus-kohtaan yhden läheisesi puhelinnumero ja sovi asiasta hänen kanssaan etukäteen. Sovellus voi lähettää siihen viestin turvapainikkeen avulla.'
  en: 'Save one trusted person’s phone number under Safety in the settings, and agree it with them beforehand. The app can text that number with the safety button.'

'safety.button.title':
  fi: 'Turvapainike'
  en: 'The safety button'

'safety.button.body':
  fi: 'Turvapainike ilmestyy treffinäytölle, kun olet tallentanut luotettavan läheisen numeron, joten tallenna se etukäteen. Yksi painallus lähettää hänelle tekstiviestin, jossa on nimesi ja pyyntö ottaa sinuun yhteyttä. Sijaintisi, treffipaikka, kellonaika ja tiedot treffikumppanistasi jäävät viestistä pois, joten kerro näistäkin etukäteen!'
  en: 'The safety button appears on the date screen once you have saved a trusted person’s number, so save it beforehand. One press texts them your name and a request to get in touch. Your location, the venue, the time and anything about your date are left out of the message, so tell them those beforehand too!'

'safety.report.title':
  fi: 'Ilmianto'
  en: 'Reporting'

'safety.report.body':
  fi: 'Jos olosi treffeillä oli turvaton, kerro siitä treffien jälkeisessä palautteessa. Tästä syntyy ilmoitus Pilkkeen ylläpidolle, ja reagoimme siihen niin pian kuin mahdollista.'
  en: 'If you did not feel safe on the date, say so in the feedback afterwards. That sends a report to Pilke’s moderators, and we act on it as soon as we can.'

# ──────────────────────────────────────────────────────────────────────────
# Meeting somebody safely
# ──────────────────────────────────────────────────────────────────────────

'tips.title':
  fi: 'Näin treffailet turvallisesti'
  en: 'How to date safely'

'tips.one':
  fi: 'Tallenna luotettavan läheisen numero ennen ensimmäisiä treffejä.'
  en: 'Save a trusted person before your first date.'

'tips.two':
  fi: 'Kerro jollekin minne menet ja milloin arvioit olevasi kotona.'
  en: 'Tell somebody where you are going and when you expect to be home.'

'tips.three':
  fi: 'Valitse ensimmäisille treffeille paikka, jossa on muita ihmisiä.'
  en: 'Pick somewhere with other people around for a first date.'

'tips.four':
  fi: 'Mene treffeille ja tule kotiin omin kyydein.'
  en: 'Arrange your own way there and your own way back.'

'tips.five':
  fi: 'Pidä puhelin ladattuna.'
  en: 'Keep your phone charged.'

# ──────────────────────────────────────────────────────────────────────────
# Location and privacy
# ──────────────────────────────────────────────────────────────────────────

'privacy.title':
  fi: 'Sijainti ja yksityisyys'
  en: 'Location and privacy'

# Two paragraphs, because these are two different things and conflating them is
# how the earlier version came to claim something the app does not do. The area
# is a choice on a map; the position is a permission during a date.
'privacy.area':
  fi: 'Voit itse valita kartalta, minne haluaisit mennä treffeille. Pilkkeen kartta on jaettu valmiiksi alueisiin, joista valitset mieluisimmat.'
  en: 'You choose on a map where you would like to go on dates. Pilke’s map is divided into areas in advance, and you pick the ones you like best.'

'privacy.body':
  fi: 'Saapuessasi treffeille voit halutessasi jakaa sijaintisi treffikumppanillesi löytääksenne toisenne. Puhelimesi sijainti näkyy vain väliaikaisesti, korkeintaan {{sharing.trail_minutes}} minuuttia treffien alkamisen jälkeen ja vain {{sharing.radius_m}} metrin säteellä treffipaikasta.'
  en: 'When you arrive at a date, you can share your location with your date if you want to, so you find each other. Your phone’s location shows only for a while, at most {{sharing.trail_minutes}} minutes after the date starts, and only within {{sharing.radius_m}} metres of the venue.'
