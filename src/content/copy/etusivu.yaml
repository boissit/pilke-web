# House style, and what this format is for, is the header of `site.yaml`.
#
# WARNING: **The site does not read this file yet.** `src/i18n/ui.ts` is still what
# every page renders from.
#
# WARNING: **The `pitch.` entries have no `en:` yet.** The front page's pitch was
# written in Finnish ahead of its translation, and in `ui.ts` the English page falls
# back to the Finnish line for each of them. Here that is a missing key, which this
# format would ship as a blank if the site were rewired to read it before they are
# translated.

# ──────────────────────────────────────────────────────────────────────────
# Hero
#
# The headline beside the phone on its coral disc. The title is the owner's own
# words, and the soft hyphen in it is where the compound may break on a phone too
# narrow for it whole. The lead is the pitch in two sentences, and the second
# button is the way down to the rest of it.
# ──────────────────────────────────────────────────────────────────────────

'hero.title':
  fi: "Vihdoin, treffi\u00adsovellus"
  en: 'Finally, a dating app'

'pitch.hero.lead':
  fi: 'Pilke etsii puolestasi ehdokkaat, yhteisen ajan ja treffipaikan. Sinä menet treffeille.'

'pitch.hero.more':
  fi: 'Miksi Pilke?'

# ──────────────────────────────────────────────────────────────────────────
# What is wrong with the other apps
#
# Three cards, in the order a reader has lived them. Nothing in them is about any
# one app: it is the routine they share.
# ──────────────────────────────────────────────────────────────────────────

'pitch.problem.title':
  fi: 'Muissa sovelluksissa treffeille on pitkä matka.'

'pitch.problem.swipe.title':
  fi: 'Ensin swaippailet'

'pitch.problem.swipe.body':
  fi: 'Selaat profiileja, luet esittelyjä ja yrität löytää joukosta sopivia ihmisiä.'

'pitch.problem.chat.title':
  fi: 'Sitten chättäilet'

'pitch.problem.chat.body':
  fi: 'Jutustelet niitä näitä, tulet ghostatuksi, chättäilet lisää ja yrität sopia treffit.'

'pitch.problem.date.title':
  fi: 'Vasta sitten tapaatte'

'pitch.problem.date.body':
  fi: 'Treffeillä näet toisen ja pääset kunnolla arvioimaan, voisiko teistä tulla jotain.'

# ──────────────────────────────────────────────────────────────────────────
# What Pilke does instead
#
# The title is the owner's own contrast line, allowed to open with a negation
# because it answers the three cards above it point for point.
#
# `match.body` says the order gets better with more users rather than that it is
# good now. `after.body` rests on the privacy statement, which says feedback answers
# are used to pick your future candidates; "auttaa" is as far as that goes.
# ──────────────────────────────────────────────────────────────────────────

'pitch.instead.title':
  fi: 'Pilkkeessä ei swaippailla eikä chättäillä.'

'pitch.instead.lead':
  fi: 'Pilke hoitaa nämä puolestasi ja tarjoaa sinulle käytännössä valmiit treffit.'

'pitch.instead.match.title':
  fi: 'Ehdokkaat toiveidesi mukaan'

'pitch.instead.match.body':
  fi: 'Toiveesi rajaavat ehdokkaat, ja persoonallisuuskysely järjestää heidät. Mitä enemmän Pilkkeessä on käyttäjiä, sitä paremmin järjestys osuu.'

'pitch.instead.invite.title':
  fi: 'Saat kutsun tai lähetät sen'

'pitch.instead.invite.body':
  fi: 'Joko treffikutsu tulee suoraan sinulle, tai löydät {{candidates.per_set}} ehdokasta ja valitset, kenelle lähetät kutsun.'

'pitch.instead.ready.title':
  fi: 'Aika ja paikka valmiina'

'pitch.instead.ready.body':
  fi: 'Jokaisen ehdokkaan kanssa kalentereissanne on vähintään {{calendar.min_shared_hours}} tunnin yhteinen aika, ja löytyy paikka, johon pääsette molemmat. Kutsussa ovat valmiina ajat ja paikat, ja toinen valitsee niistä yhden kumpaakin.'

'pitch.instead.after.title':
  fi: 'Treffien jälkeen'

'pitch.instead.after.body':
  fi: 'Jos treffit menivät hyvin ja haluatte molemmat, vaihdatte puhelinnumerot ja jatkatte Pilkkeen ulkopuolella. Jos eivät menneet nappiin, palautteesi auttaa meitä löytämään sinulle osuvampia ehdokkaita seuraaville treffeille.'

'pitch.instead.more':
  fi: 'Lue, miten Pilke toimii'

# ──────────────────────────────────────────────────────────────────────────
# In practice
#
# The owner's four steps. The first is done once and has its own card; the other
# three go round. `practice.more` is the link to the manual.
# ──────────────────────────────────────────────────────────────────────────

'pitch.practice.title':
  fi: 'Näin se menee käytännössä'

'pitch.practice.lead':
  fi: 'Tilin luonti vie noin vartin. Sitten treffeille!'

'pitch.practice.one.title':
  fi: 'Luo tili'

'pitch.practice.one.body':
  fi: 'Kerro toiveesi, vastaa persoonallisuuskyselyyn ja merkitse kalenteriin ajat, jolloin sinulle sopii käydä treffeillä. Kyselyn {{profile.story_questions}} kysymyksen perusteella järjestämme ehdokkaasi.'

'pitch.practice.two.title':
  fi: 'Kutsu tai tule kutsutuksi'

'pitch.practice.two.body':
  fi: 'Löydä ehdokkaat ja lähetä treffikutsu sille, joka tuntuu omalta tyypiltäsi. Kun sinut kutsutaan, valitset ajan ja paikan, ja treffit on sovittu.'

'pitch.practice.three.title':
  fi: 'Käy treffeillä'

'pitch.practice.three.body':
  fi: 'Treffisivulla näet ajan ja paikan kartalla. Paikan päällä voitte jakaa sijaintinne, niin löydätte toisenne.'

'pitch.practice.four.title':
  fi: 'Anna palautetta'

'pitch.practice.four.body':
  fi: 'Vastaa treffien jälkeen lyhyeen kyselyyn, niin saat kipinöitä. Sitten sovitaan uudet treffit.'

'pitch.practice.more':
  fi: 'Käyttöohje vaihe vaiheelta'

# ──────────────────────────────────────────────────────────────────────────
# Sparks and safety, a line each
#
# Each is a line and a link. The ledger of sparks is the manual's page on them, and
# the safety line's link is `safety.more`, in `turvallisuus.yaml`.
# ──────────────────────────────────────────────────────────────────────────

'pitch.sparks.title':
  fi: 'Pilke pyörii kipinöillä.'

'pitch.sparks.body':
  fi: 'Treffikutsuun kuluu {{petals.set_cost}} kipinää. Niitä kertyy ylläpidetystä kalenterista ja käydyistä treffeistä.'

'pitch.sparks.more':
  fi: 'Lue kipinöistä'

'pitch.safety.body':
  fi: 'Treffit ovat julkisissa paikoissa, jotka olemme itse valinneet, ja turvapainikkeella pyydät luotettavaa läheistäsi ottamaan yhteyttä.'

# ──────────────────────────────────────────────────────────────────────────
# Who Pilke is not for
#
# Four questions, each answered with another app that does that one thing. The wink
# is "varmaan", and the tone is a friend's tip, never a dig, so the apps are named
# exactly as they spell themselves. Valo is the Christian dating app, which is the
# joke in the last one.
# ──────────────────────────────────────────────────────────────────────────

'pitch.notfor.title':
  fi: 'Kenelle Pilke sopii?'

'pitch.notfor.lead':
  fi: 'Pilke tekee yhden asian: vie sinut treffeille. Muuhun on parempia sovelluksia.'

'pitch.notfor.more.q':
  fi: 'Entä jos haluan nähdä enemmän ehdokkaita?'

'pitch.notfor.more.a':
  fi: 'Silloin kannattaa varmaan käyttää Tinderiä.'

'pitch.notfor.chat.q':
  fi: 'Entä jos haluan jutella ennen treffejä?'

'pitch.notfor.chat.a':
  fi: 'Silloin kannattaa varmaan käyttää Bumblea.'

'pitch.notfor.phone.q':
  fi: 'Entä jos en halua käyttää puhelinta?'

'pitch.notfor.phone.a':
  fi: 'Silloin kannattaa varmaan käyttää OkCupidia.'

'pitch.notfor.algorithm.q':
  fi: 'Entä jos algoritmit ovat mielestäni paholaisen keksintö?'

'pitch.notfor.algorithm.a':
  fi: 'Silloin kannattaa varmaan käyttää Valoa.'

'pitch.notfor.questions':
  fi: 'Lisää kysyttyä'

'pitch.notfor.contact':
  fi: 'Kysy meiltä'
