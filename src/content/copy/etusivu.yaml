# House style, and what this format is for, is the header of `site.yaml`.

# ──────────────────────────────────────────────────────────────────────────
# Hero
#
# The headline beside the phone on its coral disc. The title is the owner's own
# words, and the soft hyphen in it is where the compound may break on a phone too
# narrow for it whole. The lead is the pitch in two sentences, and the second
# button is the way down to the rest of it.
# ──────────────────────────────────────────────────────────────────────────

'hero.title':
  fi: "Vihdoin, treffi\u00adsovellus"
  en: 'Finally, a dating app'

'pitch.hero.lead':
  fi: 'Pilke etsii puolestasi ehdokkaat, yhteisen ajan ja treffipaikan. Unohda turha ruljanssi ja käy treffeillä!'
  en: 'Pilke finds the people, the time and the place. You just show up.'

# ──────────────────────────────────────────────────────────────────────────
# The photographs
#
# Each is a stock photo with a real still of the app set into its phone, so the alt
# says both what the scene is and what the screen shows. `hero` is the hand on the
# coral disc; `beta` stands beside the waitlist in the footer's card, which only the
# front page hands a photograph.
# ──────────────────────────────────────────────────────────────────────────

'photo.hero':
  fi: 'Käsi pitelee puhelinta, jossa on Pilkkeen etusivu: saapunut treffikutsu, sovitut treffit ja lähetetty kutsu.'
  en: 'A hand holding a phone with the Pilke home screen: an invite received, an upcoming date and an invite sent.'

'photo.beta':
  fi: 'Puhelin kädessä persikanvärisen talon edessä, näytöllä saapunut treffikutsu: kutsuja, ajat ja paikat.'
  en: 'A phone held up in front of a peach-coloured house, showing an invite received: who sent it, the times and the places.'

# ──────────────────────────────────────────────────────────────────────────
# The other apps, struck through
#
# The steps between the hero and the Pilke section, each struck through. `swipe`
# is drawn twice, because it comes round again, and `note` is read only by a
# screen reader, before the steps.
# ──────────────────────────────────────────────────────────────────────────

'pitch.elsewhere.note':
  fi: 'Muissa sovelluksissa, yliviivattuna:'
  en: 'In other apps, struck through:'

'pitch.elsewhere.swipe':
  fi: 'Swaippaa.'
  en: 'Swipe.'

'pitch.elsewhere.chat':
  fi: 'Chättäile.'
  en: 'Chat.'

'pitch.elsewhere.ghost':
  fi: 'Tule ghostatuksi.'
  en: 'Get ghosted.'

'pitch.elsewhere.more':
  fi: 'Chättäile lisää.'
  en: 'Chat some more.'

'pitch.elsewhere.maybe':
  fi: 'Ehkä treffit.'
  en: 'Maybe a date.'

# ──────────────────────────────────────────────────────────────────────────
# What Pilke does instead, and how it goes
#
# One section: the owner's own contrast line, the lead that turns it into the four
# steps, and the four steps, each a card with its screen. The title is the one
# sentence on the site allowed to open with a negation, because the contrast is the
# point. `title` and `more` keep their keys because their words are the owner's
# unchanged; the lead and the steps are `pitch.how.*`.
#
# `after.body` rests on the privacy statement, which says feedback answers are used
# to pick your future candidates; "auttaa" is as far as that goes.
# ──────────────────────────────────────────────────────────────────────────

'pitch.instead.title':
  fi: 'Pilkkeessä ei swaippailla eikä chättäillä.'
  en: 'No swiping. No endless small talk.'

'pitch.how.lead':
  fi: 'Näin se menee käytännössä:'
  en: 'How it happens:'

'pitch.how.wishes.title':
  fi: 'Kerro mitä etsit.'
  en: 'Tell us what you’re after.'

'pitch.how.wishes.body':
  fi: 'Muista sovelluksista poiketen Pilke tarjoaa kattavat valinnat ehdokkaiden suodattamiselle jo ennen treffikutsun lähettämistä tai vastaanottamista.'
  en: 'Before anyone sends or gets an invite, you set exactly who you want to meet: kids or no kids, smoking, city or countryside, and more.'

# The owner's chip over the first step's phone: the Mieltymykset set it shows is
# not in the app yet.
'pitch.how.wishes.soon':
  fi: 'Tulossa pian'
  en: 'Coming soon'

'pitch.how.invite.title':
  fi: 'Kutsu tai tule kutsutuksi.'
  en: 'Invite, or get invited.'

'pitch.how.invite.body':
  fi: 'Lähettäessäsi kutsua valitset itsellesi sopivimman ehdokkaan ja ehdotat yhteisiä treffiaikoja ja paikkoja. Kun sinut kutsutaan, valitset lopullisen ajan ja paikan, ja treffit on sovittu.'
  en: 'To invite someone, pick the person you like best and offer a few times and places that suit you. If someone invites you, choose one of their options and it’s a date!'

'pitch.how.date.title':
  fi: 'Käy treffeillä.'
  en: 'Go on the date.'

'pitch.how.date.body':
  fi: 'Turha tuhlata aikaa sovelluksessa pelaamalla, toisen tapaaminen on ainoa kunnollinen keino tutustua. Säästäkää viestittely treffien jälkeen!'
  en: 'Don’t spend time texting someone you’ve never met. Meeting in person is the only way to get to know them, so save the chat for afterwards.'

'pitch.how.after.title':
  fi: 'Kerro, miten meni.'
  en: 'Tell us how it went.'

'pitch.how.after.body':
  fi: 'Jos treffit menivät hyvin, voitte vaihtaa puhelinnumeroita ja jatkaa Pilkkeen ulkopuolella. Voit myös jatkaa Pilkkeen käyttöä, treffipalautteesi auttaa löytämään sinulle osuvampia ehdokkaita seuraaville treffeille.'
  en: 'If it went well, swap numbers and take it from there. Or stay on Pilke: whatever you tell us about the date helps us find better matches for the next one.'

'pitch.instead.more':
  fi: 'Lue, miten Pilke toimii'
  en: 'See how Pilke works'

# ──────────────────────────────────────────────────────────────────────────
# Quality and safety
#
# Two cards side by side after the steps, the owner's own. `quality` is how the
# candidates are picked, before the first date and after each one. `safety` says
# where dates happen and that a trusted person can be saved, and links to
# `turvallisuus`, which says the rest, with that page's own `safety.more`. Its
# "julkisilla paikoilla" is the one venue claim on the site resting on a practice
# rather than on a constant: the README says why.
# ──────────────────────────────────────────────────────────────────────────

'pitch.quality.title':
  fi: 'Laatu ennen määrää'
  en: 'Quality, not quantity'

'pitch.quality.body':
  fi: 'Loputtoman ja sekalaisen profiilivirran sijasta Pilke keskittyy laatuun. Näet vähemmän ihmisiä, mutta voit luottaa siihen, että heidät on valittu toiveitasi ja treffikokemustasi optimoiden.'
  en: 'No endless scroll of random profiles. You’ll see fewer people, and each one is picked for what you’re looking for and how your past dates have gone.'

'pitch.safety.title':
  fi: 'Turvallista treffailua'
  en: 'Dates you can feel safe on'

'pitch.safety.body':
  fi: 'Kaikki treffit järjestetään valikoiduilla ja julkisilla paikoilla, eli kukaan ei kutsu sinua yksin kotiinsa. Voit myös tallentaa luotetun henkilön turvakontaktiksi.'
  en: 'Every date is at a hand-picked public venue, so nobody’s inviting you back to theirs. We also encourage you to add someone you trust as a safety contact.'

# ──────────────────────────────────────────────────────────────────────────
# Who Pilke is not for
#
# Four questions, each answered with another app that does that one thing. The wink
# is "varmaan", and the tone is a friend's tip, never a dig, so the apps are named
# exactly as they spell themselves. Valo is the Christian dating app, which is the
# joke in the last one.
# ──────────────────────────────────────────────────────────────────────────

'pitch.notfor.title':
  fi: 'Kenelle Pilke sopii?'
  en: 'Is Pilke for you?'

'pitch.notfor.lead':
  fi: 'Pilkkeellä on yksi tarkoitus: järjestää treffit. Muuhun on parempia sovelluksia.'
  en: 'Pilke does one thing: it sets up dates. Other apps do the rest better, we won’t judge.'

'pitch.notfor.more.q':
  fi: 'Entä jos haluan nähdä enemmän ehdokkaita?'
  en: 'Want to browse more people?'

'pitch.notfor.more.a':
  fi: 'Silloin kannattaa varmaan käyttää Tinderiä.'
  en: 'Tinder’s probably your thing.'

'pitch.notfor.chat.q':
  fi: 'Entä jos haluan jutella ennen treffejä?'
  en: 'Want to chat before you meet?'

'pitch.notfor.chat.a':
  fi: 'Silloin kannattaa varmaan käyttää Bumblea.'
  en: 'You could try Bumble.'

'pitch.notfor.phone.q':
  fi: 'Entä jos en halua käyttää puhelinta?'
  en: 'Don’t want to use your phone?'

'pitch.notfor.phone.a':
  fi: 'Silloin kannattaa varmaan käyttää OkCupidia.'
  en: 'OkCupid has you covered.'

'pitch.notfor.algorithm.q':
  fi: 'Entä jos algoritmit ovat mielestäni paholaisen keksintö?'
  en: 'Think algorithms are the devil’s work?'

'pitch.notfor.algorithm.a':
  fi: 'Silloin kannattaa katsoa kohti Valoa.'
  en: 'We suggest you look into Valo.'

'pitch.notfor.questions':
  fi: 'Lisää kysyttyä'
  en: 'FAQ'

'pitch.notfor.contact':
  fi: 'Kysy meiltä'
  en: 'Ask us'
