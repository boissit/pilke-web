# House style, and what this format is for, is the header of `site.yaml`.

# ──────────────────────────────────────────────────────────────────────────
# Hero
#
# The headline beside the phone on its coral disc. The title is the owner's own
# words, and the soft hyphen in it is where the compound may break on a phone too
# narrow for it whole. The lead is the pitch in two sentences, and the second
# button is the way down to the rest of it.
# ──────────────────────────────────────────────────────────────────────────

'hero.title':
  fi: "Vihdoin, treffi\u00adsovellus"
  en: 'Finally, a dating app'

'pitch.hero.lead':
  fi: 'Pilke etsii puolestasi ehdokkaat, yhteisen ajan ja treffipaikan. Sinä menet treffeille.'
  en: 'Pilke finds your candidates, a time you both have free and a place to meet. You go on the date.'

# ──────────────────────────────────────────────────────────────────────────
# The photographs
#
# Each is a stock photo with a real still of the app set into its phone, so the alt
# says both what the scene is and what the screen shows. `hero` is the hand on the
# coral disc; `beta` stands beside the waitlist in the footer's card, which only the
# front page hands a photograph.
# ──────────────────────────────────────────────────────────────────────────

'photo.hero':
  fi: 'Käsi pitelee puhelinta, jossa on Pilkkeen etusivu: saapunut treffikutsu, sovitut treffit ja lähetetty kutsu.'
  en: 'A hand holding a phone with the Pilke home screen: a date invitation received and a date agreed.'

'photo.beta':
  fi: 'Puhelin kädessä persikanvärisen talon edessä, näytöllä saapunut treffikutsu: kutsuja, ajat ja paikat.'
  en: 'A phone held up in front of a peach-coloured house, showing a date invitation received: who sent it, the times and the places.'

# ──────────────────────────────────────────────────────────────────────────
# The other apps, struck through
#
# The steps between the hero and the Pilke section, each struck through. `swipe`
# is drawn twice, because it comes round again, and `note` is read only by a
# screen reader, before the steps.
# ──────────────────────────────────────────────────────────────────────────

'pitch.elsewhere.note':
  fi: 'Muissa sovelluksissa, yliviivattuna:'
  en: 'In other apps, struck through:'

'pitch.elsewhere.swipe':
  fi: 'Swaippaa.'
  en: 'Swipe.'

'pitch.elsewhere.chat':
  fi: 'Chättäile.'
  en: 'Chat.'

'pitch.elsewhere.ghost':
  fi: 'Tule ghostatuksi.'
  en: 'Get ghosted.'

'pitch.elsewhere.more':
  fi: 'Chättäile lisää.'
  en: 'Chat some more.'

'pitch.elsewhere.maybe':
  fi: 'Ehkä treffit.'
  en: 'Maybe a date.'

# ──────────────────────────────────────────────────────────────────────────
# What Pilke does instead
#
# The title is the owner's own contrast line, the one sentence on the site allowed
# to open with a negation, because the contrast is the point. The lead's "nämä"
# points back at the struck-through steps just above the section.
#
# `match.body` says the order gets better with more users rather than that it is
# good now. `after.body` rests on the privacy statement, which says feedback answers
# are used to pick your future candidates; "auttaa" is as far as that goes.
# ──────────────────────────────────────────────────────────────────────────

'pitch.instead.title':
  fi: 'Pilkkeessä ei swaippailla eikä chättäillä.'
  en: 'No swiping and no chatting on Pilke.'

'pitch.instead.lead':
  fi: 'Pilke hoitaa nämä puolestasi ja tarjoaa sinulle käytännössä valmiit treffit.'
  en: 'Pilke takes care of all that for you and hands you a date that is practically ready.'

'pitch.instead.match.title':
  fi: 'Ehdokkaat toiveidesi mukaan'
  en: 'Candidates who fit what you want'

'pitch.instead.match.body':
  fi: 'Muista sovelluksista poiketen Pilke tarjoaa kattavat valinnat ehdokkaiden suodattamiselle jo ennen treffikutsun lähettämistä tai vastaanottamista.'
  en: 'Unlike other apps, Pilke gives you thorough options for filtering candidates before an invitation is even sent or received.'

'pitch.instead.invite.title':
  fi: 'Lähetä ja vastaanota treffikutsuja'
  en: 'Send and receive date invitations'

'pitch.instead.invite.body':
  fi: 'Valitse kenet kutsut {{candidates.per_set}} ehdokkaasta, tai tule itse valituksi ja vastaanota treffikutsu!'
  en: 'Choose who to invite from {{candidates.per_set}} candidates, or be chosen yourself and receive a date invitation!'

'pitch.instead.ready.title':
  fi: 'Aika ja paikka valmiina'
  en: 'Time and place already set'

'pitch.instead.ready.body':
  fi: 'Sinulla ja treffikumppanillasi on varmasti yhteisiä treffipaikkoja ja aikoja kalenterissa, joten valitsette niistä yhdessä teille sopivimman.'
  en: 'You and your date are sure to share date venues and times in your calendars, so together you pick the one that suits you best.'

'pitch.instead.after.title':
  fi: 'Treffien jälkeen'
  en: 'After the date'

'pitch.instead.after.body':
  fi: 'Jos treffit menivät hyvin, voitte vaihtaa puhelinnumerot ja jatkaa Pilkkeen ulkopuolella. Mikäli sopivaa ihmistä ei vielä löytynyt, treffipalautteesi auttaa löytämään sinulle osuvampia ehdokkaita seuraaville treffeille.'
  en: 'If the date went well, you can swap phone numbers and carry on outside Pilke. If you have not met the right person yet, your date feedback helps find you better-suited candidates for your next dates.'

'pitch.instead.more':
  fi: 'Lue, miten Pilke toimii'
  en: 'Read how Pilke works'

# ──────────────────────────────────────────────────────────────────────────
# In practice
#
# The owner's four steps, each a card with its screen. `practice.more` is the link
# to the manual.
# ──────────────────────────────────────────────────────────────────────────

'pitch.practice.title':
  fi: 'Näin se menee käytännössä'
  en: 'How it goes in practice'

'pitch.practice.lead':
  fi: 'Tilin luonti vie noin vartin. Sitten sovitaan ensimmäiset treffit!'
  en: 'Setting up takes about fifteen minutes. Then it’s time to arrange your first date!'

'pitch.practice.one.title':
  fi: 'Luo tili'
  en: 'Create an account'

'pitch.practice.one.body':
  fi: 'Kerro kumppanitoiveesi, vastaa persoonallisuuskyselyyn ja merkitse kalenteriin ajat, jolloin sinulle sopii käydä treffeillä. Ensimmäiset ehdokkaat löydetään kyselyn perusteella, myöhemmin treffipalautteiden voimin.'
  en: 'Say what you are looking for in a partner, answer the personality quiz and mark the times in your calendar when you could go on a date. Your first candidates are found from the quiz, and later ones from your date feedback.'

'pitch.practice.two.title':
  fi: 'Kutsu tai tule kutsutuksi'
  en: 'Invite, or be invited'

'pitch.practice.two.body':
  fi: 'Lähettäessäsi kutsua valitset itsellesi sopivimman ehdokkaan, ja ehdotat yhteisiä treffiaikoja ja paikkoja. Kun sinut kutsutaan, valitset lopullisen ajan ja paikan, ja treffit on sovittu.'
  en: 'When you send an invitation, you choose the candidate who suits you best and suggest shared times and places for the date. When someone invites you, you pick the final time and place, and the date is set.'

'pitch.practice.three.title':
  fi: 'Käy treffeillä'
  en: 'Go on the date'

'pitch.practice.three.body':
  fi: 'Treffisivulla näet ajan ja paikan kartalla. Hetki ennen treffien alkua voitte jakaa sijaintinne, niin löydätte toisenne treffipaikalla.'
  en: 'The date page shows you the time, and the place on a map. Shortly before the date starts you can share your locations, so you find each other at the venue.'

'pitch.practice.four.title':
  fi: 'Anna palautetta'
  en: 'Give feedback'

'pitch.practice.four.body':
  fi: 'Vastaa treffien jälkeen lyhyeen kyselyyn. Sitten sovitaan uudet treffit.'
  en: 'Answer a short quiz after the date. Then you set up the next one.'

'pitch.practice.more':
  fi: 'Käyttöohje vaihe vaiheelta'
  en: 'The guide, step by step'

# ──────────────────────────────────────────────────────────────────────────
# Who Pilke is not for
#
# Four questions, each answered with another app that does that one thing. The wink
# is "varmaan", and the tone is a friend's tip, never a dig, so the apps are named
# exactly as they spell themselves. Valo is the Christian dating app, which is the
# joke in the last one.
# ──────────────────────────────────────────────────────────────────────────

'pitch.notfor.title':
  fi: 'Kenelle Pilke sopii?'
  en: 'Who is Pilke for?'

'pitch.notfor.lead':
  fi: 'Pilkkeellä on yksi tarkoitus: järjestää treffit. Muuhun on parempia sovelluksia.'
  en: 'Pilke has one purpose: setting up dates. For anything else, there are better apps.'

'pitch.notfor.more.q':
  fi: 'Entä jos haluan nähdä enemmän ehdokkaita?'
  en: 'What if I want to see more candidates?'

'pitch.notfor.more.a':
  fi: 'Silloin kannattaa varmaan käyttää Tinderiä.'
  en: 'Then you’d probably be better off with Tinder.'

'pitch.notfor.chat.q':
  fi: 'Entä jos haluan jutella ennen treffejä?'
  en: 'What if I want to chat before the date?'

'pitch.notfor.chat.a':
  fi: 'Silloin kannattaa varmaan käyttää Bumblea.'
  en: 'Then you’d probably be better off with Bumble.'

'pitch.notfor.phone.q':
  fi: 'Entä jos en halua käyttää puhelinta?'
  en: 'What if I don’t want to use my phone?'

'pitch.notfor.phone.a':
  fi: 'Silloin kannattaa varmaan käyttää OkCupidia.'
  en: 'Then you’d probably be better off with OkCupid.'

'pitch.notfor.algorithm.q':
  fi: 'Entä jos algoritmit ovat mielestäni paholaisen keksintö?'
  en: 'What if I think algorithms are the devil’s work?'

'pitch.notfor.algorithm.a':
  fi: 'Silloin kannattaa varmaan käyttää Valoa.'
  en: 'Then you’d probably be better off with Valo.'

'pitch.notfor.questions':
  fi: 'Lisää kysyttyä'
  en: 'More questions'

'pitch.notfor.contact':
  fi: 'Kysy meiltä'
  en: 'Ask us'
