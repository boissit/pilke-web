# House style, and what this format is for, is the header of `site.yaml`.
#
# WARNING: **The site does not read this file yet.** `src/i18n/ui.ts` is still what
# every page renders from.

# ──────────────────────────────────────────────────────────────────────────
# Hero
#
# The headline beside the phone on its coral disc. The title and the lead are the
# owner's own words, negations included, and the one exception to the house rule
# against opening with what something is not. The soft hyphen in the title is where
# the compound may break on a phone too narrow for it whole.
# ──────────────────────────────────────────────────────────────────────────

'hero.title':
  fi: "Vihdoin, treffi\u00adsovellus"
  en: 'Finally, a dating app'

'hero.lead':
  fi: 'Ei swaippailua, ei chättäilyä. Pilke järjestää treffit silloin, kun sinulle sopii.'
  en: 'No swiping, no chatting. Pilke arranges your dates for when it suits you.'

# ──────────────────────────────────────────────────────────────────────────
# The three cards under the hero
#
# One line of body each: the headline has made the argument, and these are the three
# things to remember of it.
# ──────────────────────────────────────────────────────────────────────────

'fact.one.title':
  fi: 'Kutsu ja tule kutsutuksi'
  en: 'Invite, and be invited'

'fact.one.body':
  fi: 'Lähetä kutsu ehdokkaalle, joka tuntuu sinun tyypiltäsi, ja vastaa kutsuihin, joita saat.'
  en: 'Send an invitation to a candidate who feels like your type, and answer the ones you get.'

'fact.two.title':
  fi: 'Aika ja paikka valmiina'
  en: 'Time and place already set'

'fact.two.body':
  fi: 'Kalenterisi sopii treffit puolestasi.'
  en: 'Your calendar arranges the date for you.'

'fact.three.title':
  fi: 'Anna kipinöiden lentää'
  en: 'Let the sparks fly'

'fact.three.body':
  fi: 'Ylläpidetty kalenteri ja käydyt treffit tuovat kipinöitä. Niillä lähetät treffikutsuja.'
  en: 'A calendar kept up to date and the dates you go on bring sparks. Sparks send date invitations.'

# ──────────────────────────────────────────────────────────────────────────
# How it works
#
# What happens once, before the loop, and then the loop in four steps. `how.more`
# is the link on to `nain-se-toimii`, which carries the same thing in detail.
# ──────────────────────────────────────────────────────────────────────────

'how.title':
  fi: 'Näin se toimii'
  en: 'How it works'

'how.lead':
  fi: 'Ensin persoonallisuuskysely ja kalenteri. Sitten treffeille!'
  en: 'First the personality quiz and your calendar. Then you’re off on dates!'

'how.more':
  fi: 'Lue tarkemmin'
  en: 'Read more'

# What happens once, before the loop starts. Its own card above the four steps,
# because it is not one of them: nobody does it a second time.
'how.start.tag':
  fi: 'Ennen ensimmäistä kutsua'
  en: 'Before your first invitation'

'how.start.title':
  fi: "Aloita persoonallisuus\u00adkyselystä"
  en: 'Start with the personality quiz'

'how.start.body':
  fi: '{{profile.story_questions}} pientä tilannetta, joissa valitset, mitä tekisit. Kysely etenee kysymys kerrallaan, ja voit jatkaa myöhemmin siitä, mihin jäit. Sitten kerrot toiveesi ja merkitset kalenteriin ajat, jolloin sinulle sopii käydä treffeillä.'
  en: '{{profile.story_questions}} little situations where you choose what you would do. It goes one question at a time, and you can pick up later where you left off. Then you say what you are looking for and mark the times that suit you for a date.'

'how.one.title':
  fi: 'Lähetä treffikutsu'
  en: 'Send a date invitation'

'how.one.body':
  fi: 'Löydä ehdokkaat ja kutsu sinulle sopivin. Tarjoa pari aikaa ja paikkaa, niin kutsu lähtee.'
  en: 'Find candidates and invite the one who suits you best. Offer a couple of times and places, and your invitation is on its way.'

'how.two.title':
  fi: 'Vastaa kutsuihin'
  en: 'Answer invitations'

'how.two.body':
  fi: 'Näet, kuka kutsui ja mitä hän ehdottaa. Valitse aika ja paikka, niin treffit on sovittu.'
  en: 'You see who invited you and what they suggest. Pick a time and a place, and the date is set.'

'how.three.title':
  fi: 'Menkää treffeille'
  en: 'Go on the date'

'how.three.body':
  fi: 'Pilke kertoo ajan, paikan ja reitin. Paikan päällä voitte jakaa sijaintinne, niin löydätte toisenne.'
  en: 'Pilke gives you the time, the place and the way there. At the venue you can share your locations, so you find one another.'

'how.four.title':
  fi: 'Kerro, miten meni'
  en: 'Say how it went'

'how.four.body':
  fi: 'Vastaa treffien jälkeen pariin kysymykseen. Saat kipinöitä, ja seuraavat ehdokkaat osuvat paremmin.'
  en: 'Answer a couple of questions after the date. You earn sparks, and your next candidates fit better.'

'how.loop':
  fi: 'Ylläpidetty kalenteri tuo uusia ehdokkaita ja lisää kipinöitä.'
  en: 'A calendar kept up to date brings new candidates and more sparks.'

# ──────────────────────────────────────────────────────────────────────────
# Sparks
#
# Sparks, on the front page in two lines and no more: what they are for, the two ways
# they build up week to week, and a link to the rest. The full ledger — the welcome
# sparks, the ceiling, refunds — is `nain-se-toimii`'s. The calendar row's label is
# `detail.earn.calendar` and the date row's `detail.earn.date`, shared with that
# page so the two cannot name one way of earning differently.
# ──────────────────────────────────────────────────────────────────────────

'sparks.title':
  fi: 'Pilke pyörii kipinöiden ympärillä.'
  en: 'Pilke runs on sparks.'

'sparks.body':
  fi: 'Kipinöitä kertyy, kun merkitset kalenteriin vapaita aikoja ja käyt treffeillä. Kun niitä on {{petals.set_cost}}, voit lähettää treffikutsun.'
  en: 'Sparks build up as you mark free time in your calendar and go on dates. Once you have {{petals.set_cost}}, you can send a date invitation.'

'sparks.earn':
  fi: 'Näin niitä kertyy'
  en: 'How they add up'

'sparks.calendar.amount':
  fi: '+1'
  en: '+1'

'sparks.calendar.note':
  fi: 'enintään {{calendar.max_petals_per_week}} viikossa'
  en: 'at most {{calendar.max_petals_per_week}} a week'

'sparks.date.amount':
  fi: '+{{petals.per_date}}'
  en: '+{{petals.per_date}}'

'sparks.date.note':
  fi: 'kun olet kertonut, miten meni'
  en: 'once you have said how it went'

'sparks.highlight':
  fi: 'Kun toinen sanoo kutsullesi kyllä, kipinöitä lentää.'
  en: 'And when they say yes to your invitation, sparks fly.'

'sparks.art.alt':
  fi: 'Pilkkeen kipinälaskuri, jossa on kaksi kipinää.'
  en: 'Pilke’s spark counter, showing two sparks.'

'sparks.more':
  fi: 'Kipinät ja koko kierto tarkemmin'
  en: 'Sparks and the whole loop in detail'

# ──────────────────────────────────────────────────────────────────────────
# Safety
#
# Two cards, venues first because a reader who has not used the app yet is best
# served by where they will be sent; the trusted person and the button are one card,
# because the one does nothing without the other. The page at `turvallisuus` carries
# the whole of it.
# ──────────────────────────────────────────────────────────────────────────

'safety.front.title':
  fi: 'Turvallisuus on mukana alusta asti.'
  en: 'Safety is built in from the start.'

'safety.front.lead':
  fi: 'Tuntemattoman tapaaminen on eri asia kuin viestittely. Siksi valitsemme treffipaikat itse ja annamme sinulle turvapainikkeen. Ota se käyttöön ennen ensimmäisiä treffejä.'
  en: 'Meeting a stranger is a different thing from messaging one. So we choose the venues ourselves and give you a safety button. Set it up before your first date.'

'safety.card.places.title':
  fi: 'Paikat valitsemme itse'
  en: 'We choose the places'

'safety.card.places.body':
  fi: 'Jokainen treffipaikka on julkinen paikka, jonka olemme itse valinneet: kahvila, ravintola tai muu tila, jossa on muita ihmisiä ympärillä.'
  en: 'Every venue is a public place we picked ourselves: a cafe, a restaurant or somewhere else with other people around.'

'safety.card.button.title':
  fi: 'Turvapainike'
  en: 'The safety button'

'safety.card.button.body':
  fi: 'Tallenna asetuksiin luotettavan läheisen numero. Treffien aikana yksi painallus lähettää hänelle tekstiviestin, jossa pyydät häntä ottamaan yhteyttä.'
  en: 'Save a trusted person’s number in the settings. During a date, one press sends them a text asking them to get in touch.'

# Forward-looking, and marked as such in the copy itself. It sits under the
# cards rather than in one, because a card next to two shipped features reads
# as a third shipped feature.
'safety.future.title':
  fi: 'Tulossa: vahva tunnistautuminen'
  en: 'Coming: strong electronic identification'

'safety.future.body':
  fi: 'Haluamme varmistaa käyttäjien henkilöllisyyden suomalaisella vahvalla tunnistautumisella. Kerromme, kun se on käytössä.'
  en: 'We want to verify identities with Finnish strong electronic identification. We will tell you when it is in use.'
