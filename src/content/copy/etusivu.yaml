'pitch.a.lead':
  fi: 'Muissa sovelluksissa treffeille on pitkä matka. Pilke kulkee sen puolestasi ja tarjoaa sinulle käytännössä valmiit treffit.'
  en: 'In other apps, a date is a long way off. Pilke makes the trip for you and hands you a date that is practically ready.'

'pitch.a.elsewhere':
  fi: 'Muualla'
  en: 'Elsewhere'

'pitch.a.swipe':
  fi: 'Swaippailet, luet profiileja ja yrität löytää joukosta sopivia ihmisiä.'
  en: 'You swipe, read profiles and try to spot the people who might suit you.'

'pitch.a.chat':
  fi: 'Jutustelet niitä näitä, tulet ghostatuksi ja chättäilet lisää.'
  en: 'You make small talk, get ghosted and chat some more.'

'pitch.a.arrange':
  fi: 'Yrität sopia treffit viestien lomassa.'
  en: 'You try to set up a date between messages.'

'pitch.a.meet':
  fi: 'Vasta treffeillä näet, voisiko teistä tulla jotain. Jos ei, takaisin swaippailemaan.'
  en: 'Only on the date do you see whether anything could come of it. If not, back to swiping.'

'pitch.b.label':
  fi: 'Muualla'
  en: 'Elsewhere'

'pitch.b.swipe':
  fi: 'swaippailua'
  en: 'swiping'

'pitch.b.chat':
  fi: 'chättäilyä'
  en: 'chatting'

'pitch.b.ghost':
  fi: 'ghostausta'
  en: 'ghosting'

'pitch.b.maybe':
  fi: 'ehkä treffit'
  en: 'maybe a date'

'pitch.b.here':
  fi: 'Pilkkeessä suoraan treffeille.'
  en: 'On Pilke, straight to the date.'

'pitch.c.lead':
  fi: 'Muissa sovelluksissa treffeille pääsee vasta swaippailun ja chättäilyn jälkeen. Pilke hoitaa ne puolestasi ja tarjoaa sinulle käytännössä valmiit treffit.'
  en: 'In other apps, you only get to a date after the swiping and the chatting. Pilke takes care of those for you and hands you a date that is practically ready.'

# ──────────────────────────────────────────────────────────────────────────
# Who Pilke is not for
#
# Four questions, each answered with another app that does that one thing. The wink
# is "varmaan", and the tone is a friend's tip, never a dig, so the apps are named
# exactly as they spell themselves. Valo is the Christian dating app, which is the
# joke in the last one.
# ──────────────────────────────────────────────────────────────────────────

'pitch.notfor.title':
  fi: 'Kenelle Pilke sopii?'
  en: 'Who is Pilke for?'

'pitch.notfor.lead':
  fi: 'Pilke tekee yhden asian: vie sinut treffeille. Muuhun on parempia sovelluksia.'
  en: 'Pilke does one thing: it gets you on a date. For anything else, there are better apps.'

'pitch.notfor.more.q':
  fi: 'Entä jos haluan nähdä enemmän ehdokkaita?'
  en: 'What if I want to see more candidates?'

'pitch.notfor.more.a':
  fi: 'Silloin kannattaa varmaan käyttää Tinderiä.'
  en: 'Then you’d probably be better off with Tinder.'

'pitch.notfor.chat.q':
  fi: 'Entä jos haluan jutella ennen treffejä?'
  en: 'What if I want to chat before the date?'

'pitch.notfor.chat.a':
  fi: 'Silloin kannattaa varmaan käyttää Bumblea.'
  en: 'Then you’d probably be better off with Bumble.'

'pitch.notfor.phone.q':
  fi: 'Entä jos en halua käyttää puhelinta?'
  en: 'What if I don’t want to use my phone?'

'pitch.notfor.phone.a':
  fi: 'Silloin kannattaa varmaan käyttää OkCupidia.'
  en: 'Then you’d probably be better off with OkCupid.'

'pitch.notfor.algorithm.q':
  fi: 'Entä jos algoritmit ovat mielestäni paholaisen keksintö?'
  en: 'What if I think algorithms are the devil’s work?'

'pitch.notfor.algorithm.a':
  fi: 'Silloin kannattaa varmaan käyttää Valoa.'
  en: 'Then you’d probably be better off with Valo.'

'pitch.notfor.questions':
  fi: 'Lisää kysyttyä'
  en: 'More questions'

'pitch.notfor.contact':
  fi: 'Kysy meiltä'
  en: 'Ask us'
