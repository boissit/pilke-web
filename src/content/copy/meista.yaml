  fi: 'Miksi Pilke syntyi, ja mihin olemme menossa.'
  en: 'Why Pilke was made, and where we are headed.'

# New copy, both languages.
'about.meta.title':
  fi: 'Meistä – Pilke'
  en: 'About us – Pilke'

# New copy, both languages.
'about.meta.description':
  fi: 'Pilkkeen tarina: idea saunan lauteilta, vuosien kehitystyö ja tavoitteet eteenpäin.'
  en: 'The story of Pilke: an idea born in a sauna, years of development and the goals ahead.'

# The owner's text. The English is a draft translation.
'about.story':
  fi: 'Idea Pilkkeestä syntyi, kuten kaikki hyvät ideat, kaverin polttareilla saunassa. Olemassaolevat sovelluskonseptit eivät vakuuttaneet; käytännössä kaikki perustuvat ensin loputtomaan naamojen swaippailuun, sen jälkeen naiset hukkuvat viesteihin, ja miesten avaukset sumenevat toistensa sekaan. Lisäksi sovellukset harrastavat dynaamista hinnoittelua algoritmeilla, jotka nostavat hintaa käyttäjien epätoivon mukaan. Näiden pohjalta lähdimme suunnittelemaan kirjaimellisesti treffisovellusta: tavoitteena järjestää käyttäjille mahdollisimman hyviä treffejä, minimoida sovelluksen "pelaaminen" ja kehittää treffailukulttuuria.'
  en: 'The idea for Pilke was born, like all good ideas, in a sauna at a friend’s stag do. The existing app concepts left us unconvinced: practically all of them start with endless swiping through faces, after which women drown in messages and men’s opening lines blur into one another. On top of that, the apps go in for dynamic pricing, with algorithms that raise the price in step with their users’ desperation. So we set out to design, quite literally, an app for dates: the aim is to arrange the best possible dates for its users, to keep “gaming” the app to a minimum, and to develop dating culture.'

