# ──────────────────────────────────────────────────────────────────────────
# The pictures on the timeline
#
# One alt text per picture, named after the owner's file (`about.photo.boissit` for
# `boissit.jpg`), so a picture and its description are found by the same word.
# New copy, both languages, written from the pictures themselves. A word on a
# screen is quoted as the screen has it, and the English glosses it.
# ──────────────────────────────────────────────────────────────────────────

'about.photo.boissit':
  fi: 'Kaveriporukka nurmikolla järven rannalla kesäpäivänä: yksi soittaa ukulelea, toinen makaa nurmella, ja ympärillä on reppuja ja kasseja.'
  en: 'A group of friends on the grass by a lake on a summer day: one plays a ukulele, one lies on the grass, and there are bags and backpacks all around.'

'about.photo.visu1':
  fi: 'Varhainen Treffit-sovelluksen näkymä: Kerro itsestäsi, kysymykset sukupuolesta ja siitä, keistä olet kiinnostunut, ja Seuraava-painike.'
  en: 'An early screen of the Treffit app: Kerro itsestäsi (Tell us about yourself), with questions on gender and who you are interested in, and a Seuraava (Next) button.'

'about.photo.visu2':
  fi: 'Varhainen visuaali puhelimessa: vaaleanpunainen kirjautumisnäkymä ja tekstit Get on board, Get matched ja Get a date.'
  en: 'An early visual on a phone: a pink sign-in screen reading Get on board, Get matched and Get a date.'

'about.photo.designsprint2':
  fi: 'Suunnittelusessio mökissä: televisiossa on käyttäjäpolun kaavio, toinen istuu kannettavan ääressä ja toinen seisoo vieressä.'
  en: 'A design session in a cabin: a user-flow diagram on the TV, one person at a laptop and another standing beside it.'

'about.photo.designsprint':
  fi: 'Ikkuna täynnä post-it-lappuja, kuten Tekninen toteutus, Tech stack, Launch ja Käyttäjätestaus, ja lappujen takana hymyilevä ihminen.'
  en: 'A window covered in sticky notes such as Tekninen toteutus (technical implementation), Tech stack, Launch and Käyttäjätestaus (user testing), with someone smiling behind them.'

'about.photo.mockup1':
  fi: 'Mustavalkoinen prototyyppi: Treffit-etusivu, jossa on lähetetty treffipyyntö, ruusut ja terälehdet sekä Löydä treffit! -painike.'
  en: 'A black-and-white prototype: the Treffit home screen, with a date request sent, roses and petals, and a Löydä treffit! (Find a date!) button.'

'about.photo.mockup2':
  fi: 'Mustavalkoinen prototyyppi: kalenteri, johon merkitään päivät, jolloin olisi valmis lähtemään treffeille.'
  en: 'A black-and-white prototype: the calendar, where you mark the days you could go on a date.'

'about.photo.mockup3':
  fi: 'Mustavalkoinen prototyyppi: sovitut treffit, treffikumppanin kuva, ajankohta, kahvilatreffien paikka kartalla ja Peru treffit.'
  en: 'A black-and-white prototype: an agreed date, with the other person’s photo, the time, the café on a map and Peru treffit (Cancel the date).'

'about.photo.latevisu1':
  fi: 'Värillinen Pilkkeen näkymä: Ehdokkaat, ehdokkaan kuva, yhteiset ajat, aktiviteetit ja Ehdota!-painike.'
  en: 'A Pilke screen in colour: Ehdokkaat (Candidates), with a candidate’s photo, the times you share, activities and an Ehdota! (Propose!) button.'

'about.photo.latevisu2':
  fi: 'Värillinen Pilkkeen näkymä: Pilke-logo, sovitut treffit ja Löydä treffit! -painike.'
  en: 'A Pilke screen in colour: the Pilke wordmark, an agreed date and a Löydä treffit! (Find a date!) button.'

