# House style, and what this format is for, is the header of `site.yaml`.
#
# The about page, at `/meista` and `/en/meista`: why Pilke was made, and the
# timeline from the sauna to the goals ahead.
#
# WARNING: **A draft.** The story, the heading `Aikajana` and every line of the
# timeline are the owner's own Finnish and are final. Everything else in Finnish
# is new copy written round them and waits for the owner's word, and so does the
# whole of the English, which is a draft translation of the owner's text.

# ──────────────────────────────────────────────────────────────────────────
# The page itself
#
# `nav.about` is the label the header and the footer give this page, which took
# the guide's place in the header. `about.meta.*` are this page's own title and
# description in the document head, set through `Base.astro`'s props.
# ──────────────────────────────────────────────────────────────────────────

# New copy, both languages.
'nav.about':
  fi: 'Meistä'
  en: 'About us'

# The owner's heading, drawn with the story under it in the one card the page
# opens with.
'about.title':
  fi: 'Meistä'
  en: 'About us'

# New copy, both languages.
'about.meta.title':
  fi: 'Meistä – Pilke'
  en: 'About us – Pilke'

# New copy, both languages.
'about.meta.description':
  fi: 'Pilkkeen tarina: idea saunan lauteilta, vuosien kehitystyö ja tavoitteet eteenpäin.'
  en: 'The story of Pilke: an idea born in a sauna, years of work, and where we’re going next.'

# The owner's text, in four paragraphs and the question between them, which the
# page draws large. The English is a draft translation.
'about.story.1':
  fi: 'Konsepti niin sanotusta kirjaimellisesta treffisovelluksesta syntyi tietenkin pilke silmäkulmassa, jo pitempi tovi sitten. Olemme jalostaneet, huonontaneet ja sitten taas parantaneet ideaamme yhdessä ja erikseen, viikkoja putkeen ja vuosiin ei ollenkaan. Näkemyksistä on väitelty, implementaatiota, teknologiaa ja teoriaa jumpattu ja tämäkin teksti piti kirjoittaa kolmeen kertaan.'
  en: 'The idea of a literal dating app, one that gets you actual dates, was born with a twinkle in the eye, of course, quite a while ago now. We’ve refined it, made it worse and made it better again, together and apart, for weeks on end and then not at all for years. We’ve argued about it, wrestled with the implementation, the technology and the theory, and even this text had to be written three times.'

'about.story.2':
  fi: 'Ydinajatus on kuitenkin pysynyt jo 7 vuotta vakiona, sillä se on mielestämme kauniin yksinkertainen.'
  en: 'The core idea, though, has stayed the same for seven years, because we think it’s beautifully simple.'

'about.story.question':
  fi: 'Mitä jos treffisovelluksen kautta pääsisi treffeille?'
  en: 'What if a dating app actually got you dates?'

'about.story.3':
  fi: 'Emme tiedä onko kukaan muu huomannut, mutta moni modernien treffisovellusten käyttäjä päätyy kuluttamaan enemmän aikaa ja rahaa sovelluksessa kuin treffeillä. Selailuun ja pelailuun suunnitellut käyttöliittymät tuntuvat minimoivan kahden ihmisen aitoja kohtaamisia, eikä usean keskustelun jonglööraus, tai sen yhden ainoan elvytys, lähennä ketään.'
  en: 'We don’t know if anyone else has noticed, but a lot of people on modern dating apps end up spending more time and money in the app than on dates. Apps built for browsing and playing seem to keep real meetings between two people to a minimum, and juggling several conversations, or reviving that one, doesn’t bring anyone closer.'

'about.story.4':
  fi: 'Uskomme, että treffisovelluksen voi tehdä myös toisin. Sovelluksessamme ei ole mitään pelattavaa, se on täysin ilmainen ja järjestää juuri sinulle sopivia treffejä.'
  en: 'We believe a dating app can work differently. There’s nothing to play in ours: it’s completely free, and it sets up dates that suit you.'

# The owner's closing line, drawn like the question, with the same two sparkles in
# place of the emoji. The English is a draft translation.
'about.story.end':
  fi: 'Siinä kaikki.'
  en: 'That’s it.'

