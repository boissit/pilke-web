# House style, and what this format is for, is the header of `site.yaml`.
#
# The about page, at `/meista` and `/en/meista`: why Pilke was made, and the
# timeline from the sauna to the goals ahead.
#
# WARNING: **A draft.** The story, the heading `Aikajana` and every line of the
# timeline are the owner's own Finnish and are final. Everything else in Finnish
# is new copy written round them and waits for the owner's word, and so does the
# whole of the English, which is a draft translation of the owner's text.

# ──────────────────────────────────────────────────────────────────────────
# The page itself
#
# `nav.about` is the label the header and the footer give this page, which took
# the guide's place in the header. `about.meta.*` are this page's own title and
# description in the document head, set through `Base.astro`'s props.
# ──────────────────────────────────────────────────────────────────────────

# New copy, both languages.
